		openSetupAccountModal: function (editRow) {
			const row = editRow || null;
			const isEdit = !!row;
			const toIsoDate = (value) => {
				if (!value) return '';
				if (Object.prototype.toString.call(value) === '[object Date]' && !isNaN(value.getTime())) {
					const y = value.getFullYear();
					const m = String(value.getMonth() + 1).padStart(2, '0');
					const d = String(value.getDate()).padStart(2, '0');
					return y + '-' + m + '-' + d;
				}
				const asString = String(value).trim();
				if (/^\d{4}-\d{2}-\d{2}$/.test(asString)) return asString;
				const ddmmyyyy = asString.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
				if (ddmmyyyy) {
					const dd = String(ddmmyyyy[1]).padStart(2, '0');
					const mm = String(ddmmyyyy[2]).padStart(2, '0');
					return ddmmyyyy[3] + '-' + mm + '-' + dd;
				}
				const parsed = new Date(asString);
				if (!isNaN(parsed.getTime())) {
					const y = parsed.getFullYear();
					const m = String(parsed.getMonth() + 1).padStart(2, '0');
					const d = String(parsed.getDate()).padStart(2, '0');
					return y + '-' + m + '-' + d;
				}
				return '';
			};
			const blockEl = document.getElementById('setupAccountBlockFilter');
			const currentBlock = row ? String(row.__block || 'factory') : (blockEl ? String(blockEl.value || 'factory') : 'factory');
			const currentSystemEl = document.getElementById('setupAccountSystemFilter');
			const currentSystem = row ? String(row.SYSTEM || '') : (currentSystemEl ? String(currentSystemEl.value || '') : '');
			const initialTenant = row ? String(row.Tenant || '') : '';
			const initialTenantId = row ? String(row.Tenant_id || '') : '';
			const initialManagedBy = row ? String(row.Managed_by || '') : '';
			const initialAddress = row ? String(row.Address_of_Tenant || '') : '';
			const initialFlockId = row ? String(row.FLOCK_ID || '') : '';
			const initialFlockName = row ? String(row.FLOCK_NAME || '') : '';
			const initialStandard = row ? String(row.Standards_applied || '') : '';
			const initialStartCount = row ? String(row.Start_flock_count || '') : '';
			const initialStartDate = row ? toIsoDate(row.Start_flock_date) : '';
			const headFieldStyle = isEdit ? ' style="display:none;"' : '';
			const blockOptions = [
				{ value: 'transport', label: this.t('setupBlockTransport') },
				{ value: 'factory', label: this.t('setupBlockFactory') },
				{ value: 'farm', label: this.t('setupBlockFarm') },
				{ value: 'flock', label: this.t('setupBlockFlock') }
			].map((o) => '<option value="' + this.escapeAttr(o.value) + '" ' + (o.value === currentBlock ? 'selected' : '') + '>' + this.escape(o.label) + '</option>').join('');

			ErpModal.open({
				title: this.t('setupAccountModalTitle'),
				bodyHtml:
					'<div class="form-grid">' +
					'<div id="sa_block_wrap"' + headFieldStyle + '>' + this.formField(this.t('fServiceBlock'), '<select class="form-control" id="sa_block">' + blockOptions + '</select>') + '</div>' +
					'<div id="sa_system_wrap"' + headFieldStyle + '>' + this.formField(this.t('fSystem'), '<select class="form-control" id="sa_system"></select>') + '</div>' +
					'<div id="sa_farm_ref_wrap">' + this.formField(this.t('fFarmRef'), '<select class="form-control" id="sa_farm_ref"></select>') + '</div>' +
					'<div id="sa_tenant_wrap">' + this.formField(this.t('fTenant'), '<input class="form-control" id="sa_tenant" value="' + this.escapeAttr(initialTenant) + '">') + '</div>' +
					'<div id="sa_tenant_id_wrap">' +
					this.formField(this.t('fTenantId'), '<input class="form-control" id="sa_tenant_id" value="' + this.escapeAttr(initialTenantId) + '">') +
					'<div id="sa_tenant_id_hint" style="font-size:12px;color:#6f877c;margin-top:6px;padding-left:2px;"></div>' +
					'</div>' +
					'<div id="sa_managed_wrap">' + this.formField(this.t('fManagedBy'), '<input class="form-control" id="sa_managed_by" value="' + this.escapeAttr(initialManagedBy) + '">') + '</div>' +
					'<div id="sa_address_wrap" class="full">' + this.formField(this.t('fAddress'), '<input class="form-control" id="sa_address" value="' + this.escapeAttr(initialAddress) + '">', true) + '</div>' +
					'<div id="sa_flock_id_wrap">' + this.formField(this.t('fFlock'), '<input class="form-control" id="sa_flock_id" value="' + this.escapeAttr(initialFlockId) + '">') + '</div>' +
					'<div id="sa_flock_name_wrap">' + this.formField(this.t('fFlockName'), '<input class="form-control" id="sa_flock_name" value="' + this.escapeAttr(initialFlockName) + '">') + '</div>' +
					'<div id="sa_standard_wrap" class="form-group full">' +
					'<label class="form-label">' + this.escape(this.t('fStandardsApplied')) + '</label>' +
					'<div id="sa_standard_list" style="border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto;padding:8px;background:#fff;"></div>' +
					'</div>' +
					'<div id="sa_start_count_wrap">' + this.formField(this.t('fStartFlockCount'), '<input class="form-control" id="sa_start_count" type="number" value="' + this.escapeAttr(initialStartCount) + '">') + '</div>' +
					'<div id="sa_start_date_wrap">' + this.formField(this.t('fStartFlockDate'), '<input class="form-control" id="sa_start_date" type="date" value="' + this.escapeAttr(initialStartDate) + '">') + '</div>' +
					'</div>',
				onSubmit: async () => {
					const block = this.value('sa_block') || 'factory';
					const system = this.value('sa_system');
					const farmRefTenantId = this.value('sa_farm_ref');
					const selectedStandards = Array.from(document.querySelectorAll('input[name="sa_standard_chk"]:checked'))
						.map((el) => String(el.value || '').trim())
						.filter(Boolean);
					let tenant = this.value('sa_tenant');
					let tenantId = this.value('sa_tenant_id');
					if (block === 'factory') {
						const prefix = system + '_0';
						tenant = prefix;
						const rawTenantId = String(tenantId || '').trim();
						if (!rawTenantId) {
							tenantId = prefix;
						} else if (rawTenantId.toUpperCase().indexOf(prefix.toUpperCase()) === 0) {
							tenantId = rawTenantId;
						} else {
							tenantId = prefix + rawTenantId;
						}
					}
					if (block === 'farm') {
						tenantId = tenant;
					}
					const payload = {
						SYSTEM: system,
						Tenant: tenant,
						Tenant_id: tenantId,
						'Managed by': this.value('sa_managed_by'),
						'Address of Tenant': this.value('sa_address')
					};

					if (block === 'flock') {
						payload.FLOCK_ID = this.value('sa_flock_id');
						payload.FLOCK_NAME = this.value('sa_flock_name');
						payload['Standards applied'] = selectedStandards.join(', ');
					}
					if (block === 'flock') {
						const startCount = this.value('sa_start_count');
						payload.Start_flock_count = startCount ? Number(startCount) : '';
						payload.Start_flock_date = this.value('sa_start_date');
					}
					if (isEdit) {
						payload.__confirmUpdate = true;
					}

					await this.submitWithDuplicateConfirm('upsertConfig', payload, this.t('modalDuplicateConfigMsg'));

					if (block === 'flock' && farmRefTenantId) {
						const farmRow = (this.state.configs || []).find((r) => String(r.Tenant_id || '').trim() === farmRefTenantId);
						if (farmRow) {
							await this.rpc('upsertConfig', {
								SYSTEM: farmRow.SYSTEM || 'WMS',
								Tenant: farmRow.Tenant || '',
								Tenant_id: farmRow.Tenant_id || farmRefTenantId,
								'Managed by': farmRow['Managed by'] || '',
								'Address of Tenant': farmRow['Address of Tenant'] || '',
								FLOCK_ID: farmRow.FLOCK_ID || '',
								FLOCK_NAME: farmRow.FLOCK_NAME || '',
								'Standards applied': payload['Standards applied'] || '',
								Start_flock_count: farmRow.Start_flock_count || '',
								Start_flock_date: farmRow.Start_flock_date || '',
								__confirmUpdate: true
							});
							await this.loadBootstrap();
							await this.loadSetup(true);
						}
					}
				}
			});

			setTimeout(() => {
				const blockSelect = document.getElementById('sa_block');
				const systemSelect = document.getElementById('sa_system');
				const farmRefWrap = document.getElementById('sa_farm_ref_wrap');
				const farmRefSelect = document.getElementById('sa_farm_ref');
				const tenantWrap = document.getElementById('sa_tenant_wrap');
				const tenantInput = document.getElementById('sa_tenant');
				const tenantIdWrap = document.getElementById('sa_tenant_id_wrap');
				const tenantIdInput = document.getElementById('sa_tenant_id');
				const tenantIdHint = document.getElementById('sa_tenant_id_hint');
				const addressWrap = document.getElementById('sa_address_wrap');
				const addressInput = document.getElementById('sa_address');
				const flockIdWrap = document.getElementById('sa_flock_id_wrap');
				const flockNameWrap = document.getElementById('sa_flock_name_wrap');
				const standardList = document.getElementById('sa_standard_list');
				const standardWrap = document.getElementById('sa_standard_wrap');
				const startCountWrap = document.getElementById('sa_start_count_wrap');
				const startDateWrap = document.getElementById('sa_start_date_wrap');
				if (!blockSelect || !systemSelect) return;
				const getFactoryPrefix = () => String(systemSelect.value || 'OMS') + '_0';
				const getFarmReferenceRows = () => (this.state.configs || []).filter((r) => String(r.SYSTEM || '').trim() === 'WMS' && /^WMS_\d+$/i.test(String(r.Tenant_id || '').trim()));
				const fillFarmReferenceOptions = () => {
					if (!farmRefSelect) return;
					const rows = getFarmReferenceRows();
					const flocksByTenant = {};
					(this.state.flocks || []).forEach((f) => {
						const tenantId = String(f.Tenant_id || '').trim();
						const flockId = String(f.FLOCK_ID || '').trim();
						const flockName = String(f.FLOCK_NAME || '').trim();
						if (!tenantId || !flockId) return;
						if (!flocksByTenant[tenantId]) flocksByTenant[tenantId] = [];
						const token = flockName ? (flockId + ' (' + flockName + ')') : flockId;
						if (flocksByTenant[tenantId].indexOf(token) === -1) {
							flocksByTenant[tenantId].push(token);
						}
					});
					farmRefSelect.innerHTML = ['<option value="">-</option>']
						.concat(rows.map((r) => {
							const tenantId = String(r.Tenant_id || '').trim();
							const tenant = String(r.Tenant || '').trim();
							const flockInfo = (flocksByTenant[tenantId] || []).slice(0, 3).join(', ');
							const moreCount = Math.max((flocksByTenant[tenantId] || []).length - 3, 0);
							const flockSuffix = flockInfo
								? (' | ' + flockInfo + (moreCount > 0 ? (' +' + moreCount) : ''))
								: '';
							const label = tenantId + (tenant ? (' - ' + tenant) : '') + flockSuffix;
							return '<option value="' + this.escapeAttr(tenantId) + '">' + this.escape(label) + '</option>';
						}))
						.join('');
				};

				const fillStandardOptions = () => {
					if (!standardList) return;
					const values = Array.from(new Set(
						(this.state.loaiGa || [])
							.map((v) => String(v || '').trim())
							.filter((v) => v && v.indexOf(',') === -1)
					)).sort();
					const previousSelected = Array.from(document.querySelectorAll('input[name="sa_standard_chk"]:checked'))
						.map((el) => String(el.value || '').trim())
						.filter(Boolean);
					const initialSelected = String(initialStandard || '').split(',').map((s) => s.trim()).filter(Boolean);
					const sourceSelected = previousSelected.length > 0 ? previousSelected : initialSelected;
					const selectedSet = {};
					sourceSelected.forEach((v) => { selectedSet[v] = true; });
					if (values.length === 0) {
						standardList.innerHTML = '<div style="font-size:12px;color:#64748b;">-</div>';
						return;
					}
					standardList.innerHTML = values.map((v) => {
						const checked = selectedSet[v] ? 'checked' : '';
						return '<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer;">'
							+ '<input type="checkbox" name="sa_standard_chk" value="' + this.escapeAttr(v) + '" ' + checked + '>'
							+ '<span>' + this.escape(v) + '</span>'
							+ '</label>';
					}).join('');
				};

				const setSystemOptions = (allowed, keepCurrent) => {
					const before = keepCurrent ? String(systemSelect.value || '') : '';
					systemSelect.innerHTML = allowed.map((s) => '<option value="' + this.escapeAttr(s) + '">' + this.escape(s) + '</option>').join('');
					if (before && allowed.indexOf(before) !== -1) {
						systemSelect.value = before;
					} else if (allowed.indexOf(currentSystem) !== -1) {
						systemSelect.value = currentSystem;
					} else {
						systemSelect.value = allowed[0] || '';
					}
				};

				const syncByBlock = () => {
					const block = String(blockSelect.value || 'factory');
					if (block === 'transport') setSystemOptions(['TMS'], true);
					if (block === 'factory') setSystemOptions(['OMS', 'WMS'], true);
					if (block === 'farm') setSystemOptions(['WMS'], true);
					if (block === 'flock') setSystemOptions(['FMS'], true);

					const isFactory = block === 'factory';
					const isFarm = block === 'farm';
					const isFlock = block === 'flock';
					if (farmRefWrap) farmRefWrap.style.display = isFlock ? '' : 'none';
					if (addressWrap) addressWrap.style.display = isFlock ? 'none' : '';
					if (tenantWrap) tenantWrap.style.display = isFactory ? 'none' : '';
					if (tenantInput) tenantInput.readOnly = isFactory;
					if (tenantIdWrap) tenantIdWrap.style.display = isFarm ? 'none' : '';
					if (tenantIdHint) {
						tenantIdHint.style.display = isFactory ? '' : 'none';
						tenantIdHint.textContent = isFactory
							? ('Prefix cố định: ' + getFactoryPrefix() + ' | nhập hậu tố hoặc nhập đầy đủ Tenant ID')
							: '';
					}
					if (isFactory) {
						if (tenantInput) tenantInput.value = getFactoryPrefix();
					} else {
						if (tenantInput && /^(OMS|WMS)_0$/i.test(String(tenantInput.value || ''))) {
							tenantInput.value = '';
						}
					}
					if (flockIdWrap) flockIdWrap.style.display = isFlock ? '' : 'none';
					if (flockNameWrap) flockNameWrap.style.display = isFlock ? '' : 'none';
					if (standardWrap) standardWrap.style.display = isFlock ? '' : 'none';
					if (startCountWrap) startCountWrap.style.display = isFlock ? '' : 'none';
					if (startDateWrap) startDateWrap.style.display = isFlock ? '' : 'none';

					if (isFarm && tenantInput && tenantIdInput) {
						tenantIdInput.value = tenantInput.value;
					}

					if (isFlock) {
						fillFarmReferenceOptions();
						fillStandardOptions();
						if (addressInput && !farmRefSelect?.value && !isEdit) addressInput.value = '';
					}
				};

				blockSelect.addEventListener('change', syncByBlock);
				systemSelect.addEventListener('change', () => {
					if (String(blockSelect.value || '') !== 'factory') return;
					syncByBlock();
				});
				if (tenantInput) {
					tenantInput.addEventListener('input', () => {
						if (String(blockSelect.value || '') !== 'farm') return;
						if (tenantIdInput) tenantIdInput.value = tenantInput.value;
					});
				}
				if (farmRefSelect) {
					farmRefSelect.addEventListener('change', () => {
						if (String(blockSelect.value || '') !== 'flock') return;
						const selected = String(farmRefSelect.value || '').trim();
						if (!addressInput) return;
						if (!selected) {
							addressInput.value = '';
							return;
						}
						const match = (this.state.configs || []).find((r) => String(r.Tenant_id || '').trim() === selected);
						addressInput.value = match ? String(match['Address of Tenant'] || '') : '';
					});
				}
				syncByBlock();
			}, 0);
		},

		openSetupAccountEditModal: function (encoded) {
			try {
				const parsed = JSON.parse(encoded || '{}');
				this.openSetupAccountModal(parsed);
			} catch (e) {
				this.toast(e.message || this.t('toastSaveFailed'), 'error');
			}
		},

		openSetupProductModal: function () {
			ErpModal.open({
				title: this.t('setupProductBtn'),
				bodyHtml:
					'<div class="form-grid">' +
					this.formField(this.t('fProductName'), '<input class="form-control" id="sp_name">') +
					this.formField(this.t('fProductType'), '<input class="form-control" id="sp_type" value="Chicken_feed">') +
					this.formField(this.t('fUom'), '<input class="form-control" id="sp_uom" value="Bag">') +
					this.formField(this.t('fUomWeight'), '<input class="form-control" id="sp_weight" type="number" value="40">') +
					this.formField(this.t('fStatus'), '<select class="form-control" id="sp_status"><option>ACTIVE</option><option>INACTIVE</option></select>') +
					'</div>',
				onSubmit: async () => {
					const payload = {
						'Tên hàng hóa': this.value('sp_name'),
						'Loại sản phẩm': this.value('sp_type'),
						UOM: this.value('sp_uom'),
						UOM_weight_kg: Number(this.value('sp_weight')),
						Status: this.value('sp_status')
					};
					await this.submitWithDuplicateConfirm('upsertProductMaster', payload, this.t('modalDuplicateProductMsg'));
				}
			});
		},

		openSetupPolicyModal: function () {
			const skuOptions = this.state.products.map((p) => '<option value="' + this.escapeAttr(p['Tên hàng hóa'] || '') + '"></option>').join('');
			ErpModal.open({
				title: this.t('setupPolicyBtn'),
				bodyHtml:
					'<div class="form-grid">' +
					this.formField(this.t('fSku'), '<input class="form-control" id="pl_sku" list="plSkuList">') +
					this.formField(this.t('fZeroThreshold'), '<input class="form-control" id="pl_zero" type="number" step="0.01">') +
					this.formField(this.t('fCriticalThreshold'), '<input class="form-control" id="pl_critical" type="number" step="0.01">') +
					this.formField(this.t('fLowThreshold'), '<input class="form-control" id="pl_low" type="number" step="0.01">') +
					this.formField(this.t('fHighThreshold'), '<input class="form-control" id="pl_high" type="number" step="0.01">') +
					'</div>' +
					'<datalist id="plSkuList">' + skuOptions + '</datalist>',
				onSubmit: async () => {
					const payload = {
						'Mã hàng': this.value('pl_sku'),
						zero_threshold: Number(this.value('pl_zero')),
						critical_threshold: Number(this.value('pl_critical')),
						low_threshold: Number(this.value('pl_low')),
						high_threshold: Number(this.value('pl_high'))
					};
					await this.submitWithDuplicateConfirm('upsertPolicyThreshold', payload, this.t('modalDuplicateSkuMsg'));
				}
			});
		},

		submitWithDuplicateConfirm: async function (method, payload, confirmMessage) {
			try {
				ErpModal.setSubmitting(true);
				await this.rpc(method, payload);
				ErpModal.close();
				this.toast(this.t('toastSaveOk'), 'success');
				this.loadSetup(true);
				await this.loadBootstrap();
			} catch (err) {
				if (err.code === 'DUPLICATE_KEY') {
					const ok = await ErpDialog.confirm({
						title: this.t('modalDuplicateTitle'),
						message: confirmMessage,
						type: 'warning',
						okLabel: this.t('modalUpdate')
					});
					if (ok) {
						payload.__confirmUpdate = true;
						await this.submitWithDuplicateConfirm(method, payload, confirmMessage);
					}
					return;
				}
				this.toast(err.message || this.t('toastSaveFailed'), 'error');
			} finally {
				ErpModal.setSubmitting(false);
			}
		},

		savePolicyInline: async function (encoded) {
			try {
				const parsed = JSON.parse(encoded);
				const parseThreshold = (v) => {
					const cleaned = String(v === undefined ? '' : v).replace(/%/g, '').trim();
					return Number(cleaned);
				};
				const status = document.getElementById(parsed.key + '_status').value;
				const note = document.getElementById(parsed.key + '_note').value;
				await this.rpc('upsertPolicyThreshold', {
					'Mã hàng': parsed.sku,
					zero_threshold: parseThreshold(parsed.zero),
					critical_threshold: parseThreshold(parsed.critical),
					low_threshold: parseThreshold(parsed.low),
					high_threshold: parseThreshold(parsed.high),
					status: status,
					note: note,
					__confirmUpdate: true
				});
				this.toast(this.t('toastPolicyQuickOk'), 'success');
			} catch (e) {
				this.toast(e.message || this.t('toastPolicyQuickFailed'), 'error');
			}
		},

		drawPie: function (elId, emptyId, dataTable, colors) {
			const doDraw = () => {
				const hasData = dataTable && dataTable.length > 1;
				document.getElementById(emptyId).style.display = hasData ? 'none' : 'flex';
				if (!hasData) return;
				const data = google.visualization.arrayToDataTable(dataTable);
				const chart = new google.visualization.PieChart(document.getElementById(elId));
				chart.draw(data, {
					legend: { position: 'right' },
					backgroundColor: 'transparent',
					colors: colors && colors.length ? colors : ['#f59e0b', '#0f766e', '#1d4ed8', '#10b981', '#dc2626'],
					chartArea: { width: '88%', height: '80%' }
				});
			};
			if (window.__gchartsReady) return doDraw();
			window.__chartQueue = window.__chartQueue || [];
			window.__chartQueue.push(doDraw);
		},

		drawLine: function (elId, emptyId, dataTable) {
			const doDraw = () => {
				const hasData = dataTable && dataTable.length > 1;
				document.getElementById(emptyId).style.display = hasData ? 'none' : 'flex';
				if (!hasData) return;
				const data = google.visualization.arrayToDataTable(dataTable);
				const chart = new google.visualization.LineChart(document.getElementById(elId));
				chart.draw(data, {
					legend: { position: 'bottom' },
					backgroundColor: 'transparent',
					colors: ['#245d4b', '#c86f31'],
					chartArea: { width: '88%', height: '75%' },
					curveType: 'function'
				});
			};
			if (window.__gchartsReady) return doDraw();
			window.__chartQueue = window.__chartQueue || [];
			window.__chartQueue.push(doDraw);
		},

		rpc: function (method) {
			const args = Array.prototype.slice.call(arguments, 1);
			return new Promise((resolve, reject) => {
				const runner = google.script.run
					.withSuccessHandler((resp) => {
						if (resp && resp.success) {
							resolve(resp);
						} else if (resp && typeof resp === 'object' && resp.success === false) {
							reject({
								message: (resp.error || resp.message || this.formatT('toastServerErrorFromMethod', { method: method })),
								code: resp.errorCode,
								method: method,
								raw: resp
							});
						} else {
							let rawText = '';
							try {
								rawText = JSON.stringify(resp);
							} catch (e) {
								rawText = String(resp);
							}
							reject({
								message: this.formatT('toastInvalidResponseFromMethod', { method: method }) + (rawText ? (' | raw=' + rawText) : ''),
								code: resp && resp.errorCode,
								method: method,
								raw: resp
							});
						}
					})
					.withFailureHandler((err) => {
						reject({
							message: (err && err.message ? err.message : String(err)) + ' | method=' + method,
							method: method,
							raw: err
						});
					});
				const fn = runner[method];
				if (typeof fn !== 'function') {
					reject({ message: this.formatT('toastMethodNotFound', { method: method }) });
					return;
				}
				fn.apply(runner, args);
			});
		},

		callRaw: function (method) {
			const args = Array.prototype.slice.call(arguments, 1);
			return new Promise((resolve, reject) => {
				const runner = google.script.run
					.withSuccessHandler((resp) => resolve(resp))
					.withFailureHandler((err) => reject(err));
				const fn = runner[method];
				if (typeof fn !== 'function') {
					reject(new Error(this.formatT('toastMethodNotFound', { method: method })));
					return;
				}
				fn.apply(runner, args);
			});
		},

		toast: function (message, type) {
			const box = document.createElement('div');
			box.className = 'toast ' + (type ? ('toast-' + type) : '');
			box.textContent = message;
			document.getElementById('toastContainer').appendChild(box);
			setTimeout(() => {
				box.style.opacity = '0';
				box.style.transform = 'translateY(6px)';
				setTimeout(() => box.remove(), 180);
			}, 2800);
		},

		formField: function (label, controlHtml, full) {
			return '<div class="form-group ' + (full ? 'full' : '') + '"><label class="form-label">' + this.escape(label) + '</label>' + controlHtml + '</div>';
		},

		summaryMetric: function (label, value) {
			return '<div style="padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);">' +
				'<div style="font-size:11px;color:#6f877c;">' + this.escape(label) + '</div>' +
				'<div style="font-size:16px;font-weight:700;">' + this.escape(String(value)) + '</div></div>';
		},

		value: function (id) {
			const el = document.getElementById(id);
			return el ? String(el.value || '').trim() : '';
		},

		formatIsoDateForDisplay: function (isoValue) {
			if (!isoValue) return '';
			const parts = String(isoValue).split('-');
			if (parts.length !== 3) return '';
			return parts[2] + '/' + parts[1] + '/' + parts[0];
		},

		bindDateDisplayProxy: function (nativeId, displayId) {
			const nativeInput = document.getElementById(nativeId);
			const displayInput = document.getElementById(displayId);
			if (!nativeInput || !displayInput) return;

			const syncDisplay = () => {
				displayInput.value = this.formatIsoDateForDisplay(nativeInput.value);
			};

			const openPicker = () => {
				if (typeof nativeInput.showPicker === 'function') {
					nativeInput.showPicker();
				} else {
					nativeInput.focus();
				}
			};

			displayInput.addEventListener('click', openPicker);
			displayInput.addEventListener('focus', openPicker);
			displayInput.addEventListener('keydown', (evt) => {
				if (evt.key !== 'Enter' && evt.key !== ' ') return;
				evt.preventDefault();
				openPicker();
			});

			nativeInput.addEventListener('change', syncDisplay);
			nativeInput.addEventListener('input', syncDisplay);
			syncDisplay();
		},

		toIsoDateInput: function (value) {
			if (!value) return '';
			const d = new Date(value);
			if (isNaN(d.getTime())) return '';
			const yyyy = d.getFullYear();
			const mm = String(d.getMonth() + 1).padStart(2, '0');
			const dd = String(d.getDate()).padStart(2, '0');
			return yyyy + '-' + mm + '-' + dd;
		},

		isFutureDate: function (value) {
			if (!value) return false;
			const d = new Date(value);
			if (isNaN(d.getTime())) return false;
			d.setHours(0, 0, 0, 0);
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			return d.getTime() > today.getTime();
		},

		getRowValue: function (row, candidateKeys) {
			if (!row || !candidateKeys || candidateKeys.length === 0) return '';
			for (let i = 0; i < candidateKeys.length; i++) {
				const key = candidateKeys[i];
				if (Object.prototype.hasOwnProperty.call(row, key)) {
					const v = row[key];
					if (v !== undefined && v !== null && String(v).trim() !== '') return v;
				}
			}

			const normalize = (text) => String(text || '').toLowerCase().replace(/[^a-z0-9]/g, '');
			const normalizedCandidates = candidateKeys.map(normalize);
			const keys = Object.keys(row);
			for (let k = 0; k < keys.length; k++) {
				const rawKey = keys[k];
				if (normalizedCandidates.indexOf(normalize(rawKey)) === -1) continue;
				const value = row[rawKey];
				if (value !== undefined && value !== null && String(value).trim() !== '') return value;
			}

			return '';
		},

		badgeClass: function (badge) {
			const map = {
				Zero: 'badge-zero',
				Critical: 'badge-critical',
				Low: 'badge-low',
				Safe: 'badge-safe',
				High: 'badge-high'
			};
			return map[badge] || 'badge-empty';
		},

		orderStatusClass: function (status) {
			if (status === 'Lên kế hoạch') return 'badge-order-pending';
			if (status === 'Đã lấy hàng') return 'badge-order-deducted';
			if (status === 'Chờ giao hàng') return 'badge-order-deducted';
			if (status === 'Hoan tat') return 'badge-order-completed';
			if (status === 'Hoàn tất') return 'badge-order-completed';
			return 'badge-order-error';
		},

		orderStatusColor: function (status) {
			if (status === 'Lên kế hoạch' || status === 'Planning') return '#d55053';
			if (status === 'Đã lấy hàng' || status === 'Picked up') return '#5bb1de';
			if (status === 'Chờ giao hàng' || status === 'In transit') return '#245d4b';
			if (status === 'Hoan tat') return '#8abda2';
			if (status === 'Hoàn tất' || status === 'Completed') return '#8abda2';
			return '#64748b';
		},

		displayOrderStatus: function (status) {
			if (status === 'Lên kế hoạch') return this.t('statusPlanned');
			if (status === 'Đã lấy hàng') return this.t('statusPickedUp');
			if (status === 'Chờ giao hàng') return this.t('statusInTransit');
			if (status === 'Hoan tat') return this.t('statusCompleted');
			if (status === 'Hoàn tất') return this.t('statusCompleted');
			if (status === 'Planning') return this.t('statusPlanned');
			if (status === 'Picked up') return this.t('statusPickedUp');
			if (status === 'In transit') return this.t('statusInTransit');
			if (status === 'Completed') return this.t('statusCompleted');
			return status || '-';
		},

		displayThreshold: function (badge) {
			if (badge === 'Zero') return this.t('badgeZero');
			if (badge === 'Critical') return this.t('badgeCritical');
			if (badge === 'Low') return this.t('badgeLow');
			if (badge === 'Safe') return this.t('badgeSafe');
			if (badge === 'High') return this.t('badgeHigh');
			return badge || '-';
		},

		translateLocation: function (value) {
			if (value === 'Nhà máy' || value === 'Factory') return this.t('wmsScopeFactory');
			if (value === 'Trại' || value === 'Farm') return this.t('wmsScopeFarm');
			return value;
		},

		formatDate: function (value) {
			if (!value) return '-';
			const d = new Date(value);

			if (isNaN(d.getTime())) return this.escape(String(value));
			const dd = String(d.getDate()).padStart(2, '0');
			const mm = String(d.getMonth() + 1).padStart(2, '0');
			const yyyy = d.getFullYear();
			return dd + '/' + mm + '/' + yyyy;
		},

		escape: function (str) {
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		},

		escapeAttr: function (str) {
			return this.escape(str).replace(/`/g, '&#96;');
		}
	};

	window.App = App;

	document.addEventListener('DOMContentLoaded', function () {
		App.init();
	});
</script>
