<script>
	google.charts.load('current', { packages: ['corechart'] });
	google.charts.setOnLoadCallback(function () {
		window.__gchartsReady = true;
		if (window.__chartQueue) {
			window.__chartQueue.forEach(function (fn) { fn(); });
			window.__chartQueue = [];
		}
	});

	const App = {
		state: {
			user: null,
			lang: 'vi',
			activeView: 'dashboard',
			setupTab: 'account',
			loadedViews: {},
			configs: [],
			products: [],
			flocks: [],
			loaiGa: [],
			fmsLogRows: [],
			fmsLogPage: 1,
			fmsLogPageSize: 20,
			dashboardAlertWindowDays: 7,
			dashboardAlertItems: [],
			dashboardAlertFarm: '',
			setupFeedPage: 1,
			setupFeedPageSize: 20,
			omsRows: [],
			omsSelectedIds: {}
		},

		init: async function () {
			this.state.lang = this.getPreferredLang();
			this.injectLogo();
			this.bindEvents();
			this.applyLanguage();
			this.renderLoadingState();
			try {
				await this.loadBootstrap();
				this.switchView('dashboard');
				await this.refreshActiveView();
			} catch (err) {
				this.toast(err.message || this.t('toastInitFailed'), 'error');
			}
		},

		bindEvents: function () {
			document.getElementById('btnLang').addEventListener('click', (evt) => {
				evt.stopPropagation();
				const menu = document.getElementById('langMenu');
				const isOpen = menu.classList.toggle('is-open');
				document.getElementById('btnLang').setAttribute('aria-expanded', isOpen ? 'true' : 'false');
			});
			document.getElementById('omsBody').addEventListener('change', (evt) => this.handleOmsRowCheckboxChange(evt));
			document.getElementById('omsBody').addEventListener('click', (evt) => this.handleOmsRowActionClick(evt));
			document.getElementById('btnOmsMergeSuggest').addEventListener('click', () => this.openOrderMergeSuggestModal());
			document.getElementById('btnOmsAssignTmsAll').addEventListener('click', () => this.assignTmsForAllUnfinishedOrders());
			document.getElementById('btnOmsMergeSelected').addEventListener('click', () => this.mergeSelectedOrdersToTms());
			document.getElementById('btnOmsClearSelection').addEventListener('click', () => this.clearOmsSelection());
			document.querySelectorAll('#langMenu [data-lang]').forEach((btn) => {
				btn.addEventListener('click', () => {
					this.setLanguage(btn.dataset.lang);
					const menu = document.getElementById('langMenu');
					menu.classList.remove('is-open');
					document.getElementById('btnLang').setAttribute('aria-expanded', 'false');
				});
			});

			document.addEventListener('click', (evt) => {
				const wrap = document.getElementById('langSwitch');
				if (!wrap.contains(evt.target)) {
					document.getElementById('langMenu').classList.remove('is-open');
					document.getElementById('btnLang').setAttribute('aria-expanded', 'false');
				}
			});

			document.getElementById('mainTabs').addEventListener('click', (evt) => {
				const btn = evt.target.closest('.nav-tab');
				if (!btn) return;
				this.switchView(btn.dataset.view);
				this.refreshActiveView();
			});

			document.getElementById('btnOmsRefresh').addEventListener('click', () => this.loadOms(true));
			document.getElementById('btnWmsRefresh').addEventListener('click', () => this.loadWms(true));
			document.getElementById('btnFmsRefresh').addEventListener('click', () => this.loadFms(true));

			document.getElementById('omsStatusFilter').addEventListener('change', () => this.loadOms(true));
			document.getElementById('omsSearch').addEventListener('input', () => this.loadOms(true));
			document.getElementById('wmsScopeFilter').addEventListener('change', () => this.updateWmsScopeUi());
			document.getElementById('wmsTenantFilter').addEventListener('change', () => this.loadWms(true));
			document.getElementById('fmsFlockFilter').addEventListener('change', () => this.loadFms(true));
			document.getElementById('fmsLogPagination').addEventListener('click', (evt) => this.handleFmsLogPaginationClick(evt));

			document.getElementById('btnCreateOrder').addEventListener('click', () => this.openCreateOrderModal());
			document.getElementById('btnWmsInbound').addEventListener('click', () => this.openTxnModal('Inbound'));
			document.getElementById('btnWmsOutbound').addEventListener('click', () => this.openTxnModal('Outbound'));
			document.getElementById('btnWmsAdjust').addEventListener('click', () => this.openAdjustModal());

			document.getElementById('btnSetupProduct').addEventListener('click', () => this.openSetupProductModal());
			document.getElementById('btnSetupPolicy').addEventListener('click', () => this.openSetupPolicyModal());
			document.getElementById('btnSetupAccount').addEventListener('click', () => this.openSetupAccountModal());
			document.getElementById('setupAccountBlockFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountSystemFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountTenantFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountTenantIdFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountAddressFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountFlockIdFilter').addEventListener('change', () => this.loadSetup(true));
			document.getElementById('setupAccountFlockNameFilter').addEventListener('change', () => this.loadSetup(true));

			document.getElementById('setupTabs').addEventListener('click', (evt) => {
				const btn = evt.target.closest('[data-setup-tab]');
				if (!btn) return;
				this.switchSetupTab(btn.dataset.setupTab);
			});

			document.getElementById('setupFeedAgeFilter').addEventListener('input', () => {
				this.state.setupFeedPage = 1;
				this.loadSetup(true);
			});
			document.getElementById('setupFeedChickenFilter').addEventListener('change', () => {
				this.state.setupFeedPage = 1;
				this.loadSetup(true);
			});
			document.getElementById('setupFeedTypeFilter').addEventListener('change', () => {
				this.state.setupFeedPage = 1;
				this.loadSetup(true);
			});
			document.getElementById('setupFeedPagination').addEventListener('click', (evt) => this.handleSetupFeedPaginationClick(evt));
			document.getElementById('setupPolicySearch').addEventListener('input', () => this.loadSetup(true));
			document.getElementById('setupPolicyBody').addEventListener('click', (evt) => {
				const btn = evt.target.closest('[data-save-policy]');
				if (!btn) return;
				this.savePolicyInline(btn.dataset.savePolicy);
			});
			document.getElementById('setupConfigBody').addEventListener('click', (evt) => {
				const btn = evt.target.closest('[data-edit-config]');
				if (!btn) return;
				this.openSetupAccountEditModal(btn.dataset.editConfig);
			});

			document.getElementById('dashboardAlertFarmFilter').addEventListener('change', (evt) => {
				this.state.dashboardAlertFarm = String(evt.target.value || '');
				this.renderDashboardAlertTable({
					items: this.state.dashboardAlertItems,
					days: this.state.dashboardAlertWindowDays
				});
			});

		},

		renderLoadingState: function () {
			document.getElementById('dashboardKpis').innerHTML = '<div class="state-box card" style="grid-column:1/-1;">' + this.escape(this.t('msgLoadingDashboard')) + '</div>';
		},

		loadBootstrap: async function () {
			const user = await this.callRaw('getCurrentUserProfile');
			const [configsResp, productsResp, flocksResp, loaiGaResp] = await Promise.all([
				this.rpc('getConfigList'),
				this.rpc('getProductMasterList'),
				this.rpc('getFlockList'),
				this.rpc('getDistinctLoaiGa')
			]);

			this.state.user = user;
			this.state.configs = configsResp.data || [];
			this.state.products = (productsResp.data || []).filter((p) => String(p.Status || '').toUpperCase() === 'ACTIVE');
			this.state.flocks = flocksResp.data || [];
			this.state.loaiGa = loaiGaResp.data || [];

			this.renderUserChip();
			this.applyRoleBasedViewAccess();

			this.fillTenantOptions();
			this.fillFlockOptions();
		},

		injectLogo: function () {
			if (window.JAPFA_LOGO_DATA) {
				document.getElementById('brandLogo').src = window.JAPFA_LOGO_DATA;
			}
		},

		getPreferredLang: function () {
			try {
				const saved = localStorage.getItem('japfa_lang');
				if (saved === 'vi' || saved === 'en') return saved;
			} catch (e) {
				// ignore storage read failures
			}
			return 'vi';
		},

		setLanguage: function (lang) {
			if (lang !== 'vi' && lang !== 'en') return;
			this.state.lang = lang;
			this.applyLanguage();
			this.renderUserChip();
			this.refreshActiveView(true);
			try {
				localStorage.setItem('japfa_lang', lang);
			} catch (e) {
				// ignore storage write failures
			}
		},

		applyLanguage: function () {
			const lang = this.state.lang === 'en' ? 'en' : 'vi';
			const dict = I18N[lang] || I18N.vi;
			document.documentElement.lang = lang;
			document.getElementById('brandContext').textContent = dict.brandContext;
			this.applyStaticTranslations();
			this.fillTenantOptions();
			this.fillFlockOptions();
			document.getElementById('langCurrent').textContent = lang.toUpperCase();
			document.querySelectorAll('#langMenu [data-lang]').forEach((btn) => {
				btn.classList.toggle('is-active', btn.dataset.lang === lang);
			});
			if (!this.state.user) {
				document.getElementById('userChip').innerHTML = '<span class="material-symbols-outlined">person</span>' + this.escape(dict.loadingUser);
			}
		},

		t: function (key) {
			const lang = this.state.lang === 'en' ? 'en' : 'vi';
			const dict = I18N[lang] || I18N.vi;
			return dict[key] || I18N.vi[key] || key;
		},

		formatT: function (key, params) {
			let text = this.t(key);
			if (!params) return text;
			Object.keys(params).forEach((k) => {
				text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), String(params[k]));
			});
			return text;
		},

		applyStaticTranslations: function () {
			const map = {
				navDashboardLabel: 'navDashboard',
				navOmsLabel: 'navOms',
				navWmsLabel: 'navWms',
				navFmsLabel: 'navFms',
				navSetupLabel: 'navSetup',
				setupTabAccountLabel: 'setupTabAccount',
				setupTabStandardLabel: 'setupTabStandard',
				setupTabFeedLabel: 'setupTabFeed',
				dashboardTitle: 'dashboardTitle',
				dashboardDesc: 'dashboardDesc',
				dashboardOrderPieTitle: 'dashboardOrderPieTitle',
				dashboardOrderPieEmptyText: 'dashboardOrderPieEmpty',
				dashboardAlertTitle: 'dashboardAlertTitle',
				dashboardAlertFarmFilterLabel: 'dashboardAlertFlockFilterLabel',
				omsTitle: 'omsTitle',
				omsDesc: 'omsDesc',
				omsFactoryTitle: 'wmsScopeFactory',
				omsFactoryInventoryTitle: 'wmsInventoryTitle',
				omsFactoryTxnTitle: 'wmsTxnTitle',
				btnCreateOrderLabel: 'btnCreateOrder',
				omsStatusAllOption: 'statusAll',
				omsStatusPlannedOption: 'statusPlanned',
				omsStatusPickedOption: 'statusPickedUp',
				omsStatusTransitOption: 'statusInTransit',
				omsStatusCompletedOption: 'statusCompleted',
				btnOmsRefreshLabel: 'reload',
				wmsTitle: 'wmsTitle',
				wmsDesc: 'wmsDesc',
				btnWmsInboundLabel: 'wmsInbound',
				btnWmsOutboundLabel: 'wmsOutbound',
				btnWmsAdjustLabel: 'wmsAdjust',
				wmsScopeFarmOption: 'wmsScopeFarm',
				wmsScopeFactoryOption: 'wmsScopeFactory',
				btnWmsRefreshLabel: 'reload',
				wmsScopeNote: 'wmsScopeNote',
				wmsInventoryTitle: 'wmsInventoryTitle',
				wmsTxnTitle: 'wmsTxnTitle',
				fmsTitle: 'fmsTitle',
				fmsDesc: 'fmsDesc',
				btnFmsRefreshLabel: 'reload',
				fmsChartTitle: 'fmsChartTitle',
				fmsPopulationEmptyText: 'fmsChartEmpty',
				fmsLogTitle: 'fmsLogTitle',
				setupTitle: 'setupTitle',
				setupDesc: 'setupDesc',
				btnSetupAccountLabel: 'setupAccountBtn',
				btnSetupProductLabel: 'setupProductBtn',
				btnSetupPolicyLabel: 'setupPolicyBtn',
				setupConfigTitle: 'setupConfigTitle',
				setupAccountBlockFilterLabel: 'setupFilterBlockLabel',
				setupAccountSystemFilterLabel: 'setupFilterSystemLabel',
				setupAccountTenantFilterLabel: 'setupFilterTenantLabel',
				setupAccountTenantIdFilterLabel: 'setupFilterTenantIdLabel',
				setupAccountAddressFilterLabel: 'setupFilterAddressLabel',
				setupAccountFlockIdFilterLabel: 'setupFilterFlockIdLabel',
				setupAccountFlockNameFilterLabel: 'setupFilterFlockNameLabel',
				setupAccountStartCountFilterLabel: 'setupFilterStartCountLabel',
				setupAccountStartDateFilterLabel: 'setupFilterStartDateLabel',
				setupProductTitle: 'setupProductTitle',
				setupFeedTitle: 'setupFeedTitle',
				setupFeedAgeFilterLabel: 'fAgeDay',
				setupFeedChickenFilterLabel: 'fChickenType',
				setupFeedTypeFilterLabel: 'fFeedType',
				setupPolicyTitle: 'setupPolicyTitle',
				btnOmsMergeSuggestLabel: 'btnOmsMergeSuggestLabel',
				btnOmsAssignTmsAllLabel: 'btnOmsAssignTmsAllLabel',
				btnOmsMergeSelectedLabel: 'btnOmsMergeSelectedLabel',
				btnOmsClearSelection: 'btnOmsClearSelectionLabel'
			};
			Object.keys(map).forEach((id) => {
				const el = document.getElementById(id);
				if (el) el.textContent = this.t(map[id]);
			});
			const omsSearch = document.getElementById('omsSearch');
			if (omsSearch) omsSearch.placeholder = this.t('searchOms');
			const setupFeedAgeFilter = document.getElementById('setupFeedAgeFilter');
			if (setupFeedAgeFilter) setupFeedAgeFilter.placeholder = this.t('fAgeDay');
			const setupPolicySearch = document.getElementById('setupPolicySearch');
			if (setupPolicySearch) setupPolicySearch.placeholder = this.t('setupPolicySearch');
		},

		handleSetupFeedPaginationClick: function (evt) {
			const btn = evt.target.closest('button[data-page]');
			if (!btn) return;
			const page = Number(btn.dataset.page || 1);
			if (!isFinite(page) || page < 1) return;
			this.state.setupFeedPage = page;
			this.loadSetup(true);
		},

		renderSimplePagination: function (total, pageSize, page) {
			const safeTotal = Math.max(0, Number(total) || 0);
			const safePageSize = Math.max(1, Number(pageSize) || 20);
			const totalPages = Math.max(1, Math.ceil(safeTotal / safePageSize));
			const safePage = Math.max(1, Math.min(totalPages, Number(page) || 1));

			if (safeTotal === 0) return '';

			let startPage = Math.max(1, safePage - 2);
			let endPage = Math.min(totalPages, startPage + 4);
			startPage = Math.max(1, endPage - 4);

			const pageButtons = [];
			for (let p = startPage; p <= endPage; p++) {
				pageButtons.push('<button class="page-btn ' + (p === safePage ? 'is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
			}

			const from = (safePage - 1) * safePageSize + 1;
			const to = Math.min(safePage * safePageSize, safeTotal);
			const info = this.formatT('paginationInfo', { from: from, to: to, total: safeTotal });

			return '<div>' + this.escape(info) + '</div>' +
				'<div class="pagination-controls">' +
				'<button class="page-btn" data-page="' + (safePage - 1) + '" ' + (safePage <= 1 ? 'disabled' : '') + '>' + this.escape(this.t('pagePrev')) + '</button>' +
				pageButtons.join('') +
				'<button class="page-btn" data-page="' + (safePage + 1) + '" ' + (safePage >= totalPages ? 'disabled' : '') + '>' + this.escape(this.t('pageNext')) + '</button>' +
				'</div>';
		},

		renderUserChip: function () {
			if (!this.state.user) return;
			document.getElementById('userChip').innerHTML = '<span class="material-symbols-outlined">person</span>' +
				this.escape(this.state.user.email || 'unknown') + ' | ' + this.escape(this.state.user.role || 'User');
		},

		isProcurementUser: function () {
			const role = String((this.state.user && this.state.user.role) || '').toLowerCase();
			return /procurement|purchasing|buyer|mua\s*hang/.test(role);
		},

		isFarmTechUser: function () {
			const role = String((this.state.user && this.state.user.role) || '').toLowerCase();
			return /farm[_\s-]*technical|farm[_\s-]*tech|technical[_\s-]*farm|ky\s*thuat.*farm|farm.*ky\s*thuat/.test(role);
		},

		applyRoleBasedViewAccess: function () {
			const tabOms = document.querySelector('.nav-tab[data-view="oms"]');
			const tabWms = document.querySelector('.nav-tab[data-view="wms"]');
			if (!tabOms || !tabWms) return;

			const isProc = this.isProcurementUser();
			const isFarmTech = this.isFarmTechUser();

			if (isProc) {
				tabOms.style.display = '';
				tabWms.style.display = 'none';
			} else if (isFarmTech) {
				tabOms.style.display = 'none';
				tabWms.style.display = '';
			} else {
				tabOms.style.display = '';
				tabWms.style.display = '';
			}

			if (this.state.activeView === 'oms' && tabOms.style.display === 'none') {
				this.switchView('wms');
			}
			if (this.state.activeView === 'wms' && tabWms.style.display === 'none') {
				this.switchView('oms');
			}
		},

		refreshActiveView: async function (force) {
			if (!force && this.state.loadedViews[this.state.activeView]) return;
			if (this.state.activeView === 'dashboard') return this.loadDashboard(force);
			if (this.state.activeView === 'oms') return this.loadOms(force);
			if (this.state.activeView === 'wms') return this.loadWms(force);
			if (this.state.activeView === 'fms') return this.loadFms(force);
			if (this.state.activeView === 'setup') return this.loadSetup(force);
		},

		switchView: function (viewName) {
			this.state.activeView = viewName;
			document.querySelectorAll('.nav-tab').forEach((el) => el.classList.toggle('is-active', el.dataset.view === viewName));
			document.querySelectorAll('.view').forEach((el) => el.classList.toggle('is-active', el.id === 'view-' + viewName));
			if (viewName === 'setup') {
				this.switchSetupTab(this.state.setupTab || 'account');
			}
		},

		switchSetupTab: function (tabName) {
			const allowed = { account: true, standard: true, feed: true };
			const nextTab = allowed[tabName] ? tabName : 'account';
			this.state.setupTab = nextTab;

			document.querySelectorAll('#setupTabs .setup-tab').forEach((el) => {
				el.classList.toggle('is-active', el.dataset.setupTab === nextTab);
			});

			document.querySelectorAll('#view-setup .setup-panel').forEach((panel) => {
				const isActive = panel.id === ('setup-panel-' + nextTab);
				panel.classList.toggle('is-active', isActive);
				panel.style.display = isActive ? '' : 'none';
			});
		},

		fillTenantOptions: function () {
			const tenantSelect = document.getElementById('wmsTenantFilter');
			const options = ['<option value="">' + this.escape(this.t('allTenants')) + '</option>']
				.concat(this.state.configs.map((c) => '<option value="' + this.escapeAttr(c.Tenant_id || '') + '">' +
					this.escape(c.Tenant_id || '') + ' - ' + this.escape(c.Tenant || '') + '</option>'));
			tenantSelect.innerHTML = options.join('');
		},

		fillFlockOptions: function () {
			const flockSelect = document.getElementById('fmsFlockFilter');
			const options = ['<option value="">' + this.escape(this.t('selectFlock')) + '</option>']
				.concat(this.state.flocks.map((f) => '<option value="' + this.escapeAttr(f.FLOCK_ID || '') + '">' +
					this.escape(f.FLOCK_ID || '') + ' - ' + this.escape(f.Tenant || '') + '</option>'));
			flockSelect.innerHTML = options.join('');
		},

		updateWmsScopeUi: function () {
			const scopeFilter = document.getElementById('wmsScopeFilter');
			if (scopeFilter) scopeFilter.value = 'farm';
			const scope = 'farm';
			const tenant = document.getElementById('wmsTenantFilter');
			tenant.disabled = scope === 'factory';
			if (scope === 'factory') tenant.value = '';
			this.loadWms(true);
		},

		loadDashboard: async function () {
			try {
				const [overview, alertsResp] = await Promise.all([
					this.rpc('getDashboardOverview'),
					this.rpc('getDashboardFMSAlertTable', this.state.dashboardAlertWindowDays)
				]);

				const ov = overview.data || {};
				const statusCounts = ov.orderStatusCounts || {};
				const kpis = [
					{ label: this.t('dashboardAlertTitle'), value: ov.fmsAlertCount || 0, icon: 'warning' },
					{ label: this.t('wmsScopeFactory') + ' SKU', value: (ov.factoryInventory || []).length, icon: 'factory' },
					{ label: this.t('wmsScopeFarm') + ' SKU', value: (ov.farmInventory || []).length, icon: 'agriculture' },
					{ label: this.t('navOms') + ' ' + this.t('kpiTotalSuffix'), value: Object.values(statusCounts).reduce((a, b) => a + (Number(b) || 0), 0), icon: 'receipt_long' }
				];

				document.getElementById('dashboardKpis').innerHTML = kpis.map((k) =>
					'<div class="kpi-card">' +
					'<div class="kpi-icon"><span class="material-symbols-outlined">' + k.icon + '</span></div>' +
					'<div class="kpi-label">' + this.escape(k.label) + '</div>' +
					'<div class="kpi-value">' + this.escape(String(k.value)) + '</div>' +
					'</div>'
				).join('');

				const chartData = [[this.t('hStatus'), this.t('hCount')]];
				const chartColors = [];
				Object.keys(statusCounts).forEach((k) => {
					const value = Number(statusCounts[k]) || 0;
					if (value <= 0) return;
					chartData.push([this.displayOrderStatus(k), value]);
					chartColors.push(this.orderStatusColor(k));
				});
				this.drawPie('dashboardOrderPie', 'dashboardOrderPieEmpty', chartData, chartColors);
				this.state.dashboardAlertItems = ((alertsResp && alertsResp.data && alertsResp.data.items) || []);

				this.renderDashboardAlertTable((alertsResp && alertsResp.data) || {
					items: [],
					total: 0,
					days: this.state.dashboardAlertWindowDays
				});
				this.state.loadedViews.dashboard = true;
			} catch (err) {
				this.toast(err.message || this.t('toastDashboardFailed'), 'error');
			}
		},

		renderDashboardAlertTable: function (payload) {
			const allRows = payload.items || [];
			const farmFilter = document.getElementById('dashboardAlertFarmFilter');
			const farms = [];
			const farmSeen = {};
			allRows.forEach((r) => {
				const farm = String(r.TENANT_ID || r.FARM_NAME || '').trim();
				if (!farm || farmSeen[farm]) return;
				farmSeen[farm] = true;
				farms.push(farm);
			});

			if (farms.length > 0) {
				if (!this.state.dashboardAlertFarm || farms.indexOf(this.state.dashboardAlertFarm) === -1) {
					this.state.dashboardAlertFarm = farms[0];
				}
				farmFilter.innerHTML = farms
					.map((farm) => '<option value="' + this.escapeAttr(farm) + '">' + this.escape(farm) + '</option>')
					.join('');
				farmFilter.value = this.state.dashboardAlertFarm;
				farmFilter.disabled = false;
			} else {
				this.state.dashboardAlertFarm = '';
				farmFilter.innerHTML = '<option value="">-</option>';
				farmFilter.disabled = true;
			}

			const selectedFarm = this.state.dashboardAlertFarm;
			const rows = selectedFarm
				? allRows.filter((r) => String(r.TENANT_ID || r.FARM_NAME || '').trim() === selectedFarm)
				: allRows;

			document.getElementById('dashboardAlertHead').innerHTML =
				'<tr>' +
				'<th>' + this.escape(this.t('hDate')) + '</th>' +
				'<th>' + this.escape(this.t('hFarm')) + '</th>' +
				'<th>' + this.escape(this.t('hFlock')) + '</th>' +
				'<th>' + this.escape(this.t('hProductName')) + '</th>' +
				'<th>' + this.escape(this.t('hStatus')) + '</th>' +
				'</tr>';

			document.getElementById('dashboardAlertBody').innerHTML = rows.length === 0

					'<td>' + this.escape(r.FLOCK_ID || '-') + '</td>' +
					'<td>' + this.escape(r.FEED_NAME || '-') + '</td>' +

		loadOms: async function () {
			const body = document.getElementById('omsBody');
			body.innerHTML = '<tr><td colspan="10"><div class="state-box">' + this.escape(this.t('msgLoadingOrders')) + '</div></td></tr>';
			try {
				const status = document.getElementById('omsStatusFilter').value;
				const search = document.getElementById('omsSearch').value.trim().toLowerCase();
				const filters = status ? { Status: status } : {};
				const resp = await this.rpc('getOrderList', filters);
				let rows = resp.data || [];
				if (search) {
					rows = rows.filter((r) => {
						const target = [
							this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID']),
							this.getRowValue(r, ['Client']),
							this.getRowValue(r, ['Mã hàng', 'SKU']),
							this.getRowValue(r, ['Nơi đi']),
							this.getRowValue(r, ['Nơi đến']),
							this.getRowValue(r, ['FLOCK_ID', 'FLOCK ID', 'Flock ID'])
						].join(' ').toLowerCase();
						return target.indexOf(search) !== -1;
					});
				}
				this.state.omsRows = rows;

				// Giữ lại lựa chọn cũ chỉ cho những Order ID còn xuất hiện trong danh sách mới
				const visibleIds = {};
				rows.forEach((r) => { visibleIds[this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID'])] = true; });
				Object.keys(this.state.omsSelectedIds || {}).forEach((id) => {
					if (!visibleIds[id]) delete this.state.omsSelectedIds[id];
				});

				document.getElementById('omsHead').innerHTML =
					'<tr><th>' + this.escape(this.t('hSelect')) + '</th><th>' + this.escape(this.t('hOrderId')) + '</th><th>' + this.escape(this.t('hClient')) + '</th><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hQty')) + '</th><th>' + this.escape(this.t('hFrom')) + '</th><th>' + this.escape(this.t('hTo')) + '</th><th>' + this.escape(this.t('hFlock')) + '</th><th>' + this.escape(this.t('hStatus')) + '</th><th>' + this.escape(this.t('hTmsOrderId')) + '</th><th>' + this.escape(this.t('hCreateDate')) + '</th><th>' + this.escape(this.t('hAction')) + '</th></tr>';
				body.innerHTML = rows.length === 0
					? '<tr><td colspan="12"><div class="state-box"><span class="material-symbols-outlined">inbox</span>' + this.escape(this.t('msgNoOrders')) + '</div></td></tr>'
					: rows.slice(0, 200).map((r) => {
						const orderId = this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID']);
						const client = this.getRowValue(r, ['Client']);
						const sku = this.getRowValue(r, ['Mã hàng', 'SKU']);
						const qty = this.getRowValue(r, ['Số lượng', 'Qty']);
						const from = this.getRowValue(r, ['Nơi đi']);
						const to = this.getRowValue(r, ['Nơi đến']);
						const flockId = this.getRowValue(r, ['FLOCK_ID', 'FLOCK ID', 'Flock ID']);
						const statusText = this.getRowValue(r, ['Status', 'Trạng thái']);
						const tmsOrderId = this.getRowValue(r, ['TMS_Order ID']);
						const createDate = this.getRowValue(r, ['Create Date', 'Create date', 'Ngày tạo đơn hàng']);
						const eligible = this.isOmsOrderMergeable(r);
						const editable = this.isOmsOrderEditable(r);
						const checked = orderId && this.state.omsSelectedIds[orderId] ? 'checked' : '';
						const checkboxHtml = eligible
							? '<input type="checkbox" data-order-id="' + this.escapeAttr(orderId) + '" ' + checked + '>'
							: '<input type="checkbox" disabled title="' + this.escapeAttr(this.t('mergeNotEligibleHint')) + '">';
						const actionButtons =
							'<div class="inline-fields" style="gap:6px;">' +
							'<button class="btn btn-outline btn-sm" type="button" data-view-order-id="' + this.escapeAttr(orderId) + '">' + this.escape(this.t('btnViewDetail')) + '</button>' +
							'<button class="btn btn-ghost btn-sm" type="button" data-edit-order-id="' + this.escapeAttr(orderId) + '" ' + (editable ? '' : 'disabled title="' + this.escapeAttr(this.t('editNotEligibleHint')) + '"') + '>' + this.escape(this.t('btnEditOrder')) + '</button>' +
							'</div>';
						return '<tr>' +
							'<td>' + checkboxHtml + '</td>' +
							'<td>' + this.escape(orderId || '-') + '</td>' +
							'<td>' + this.escape(client || '') + '</td>' +
							'<td>' + this.escape(sku || '') + '</td>' +
							'<td>' + this.escape(String(qty || '')) + '</td>' +
							'<td>' + this.escape(this.translateLocation(from || '')) + '</td>' +
							'<td>' + this.escape(this.translateLocation(to || '')) + '</td>' +
							'<td>' + this.escape(flockId || '-') + '</td>' +
							'<td><span class="badge ' + this.orderStatusClass(statusText) + '">' + this.escape(this.displayOrderStatus(statusText || '')) + '</span></td>' +
							'<td>' + (tmsOrderId ? '<span class="badge badge-outline">' + this.escape(tmsOrderId) + '</span>' : '-') + '</td>' +
							'<td>' + this.formatDate(createDate) + '</td>' +
							'<td>' + actionButtons + '</td>' +
							'</tr>';
					}).join('');
				this.state.loadedViews.oms = true;
				this.updateOmsMergeToolbar();
				await this.loadOmsFactoryPanel();
			} catch (err) {
				body.innerHTML = '<tr><td colspan="12"><div class="state-box" style="color:#b3261e;">' + this.escape(err.message || this.t('toastOmsFailed')) + '</div></td></tr>';
			}
		},

		loadOmsFactoryPanel: async function () {

			if (!invBody || !txnBody) return;

			invBody.innerHTML = '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgLoadingInventory')) + '</div></td></tr>';
			txnBody.innerHTML = '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgLoadingTransactions')) + '</div></td></tr>';

			try {
				const resp = await this.rpc('getDashboardWMS', 'factory', null, 12);
				const data = resp.data || {};
				const inventory = data.inventory || [];
				const txns = data.recentTransactions || [];

				document.getElementById('omsFactoryInventoryHead').innerHTML = '<tr><th>' + this.escape(this.t('hTenant')) + '</th><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hCurrentStock')) + '</th><th>' + this.escape(this.t('hBadge')) + '</th><th>' + this.escape(this.t('hLastDate')) + '</th><th>' + this.escape(this.t('hNote')) + '</th></tr>';

					? '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgNoInventory')) + '</div></td></tr>'

						'<tr>' +
						'<td>' + this.escape(r.Tenant_id || r.Tenant || '-') + '</td>' +
						'<td>' + this.escape(r.SKU || '-') + '</td>' +
						'<td>' + this.escape(String(r.currentStock || 0)) + '</td>' +
						'<td><span class="badge ' + this.badgeClass(r.badge) + '">' + this.escape(r.badge || 'N/A') + '</span></td>' +
						'<td>' + this.formatDate(r.DATE || r.lastTransactionDate) + '</td>' +
						'<td>' + this.escape(r.feedState || r.lastTransactionType || '-') + '</td>' +
						'</tr>'
					).join('');

				document.getElementById('omsFactoryTxnHead').innerHTML = '<tr><th>' + this.escape(this.t('hTenant')) + '</th><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hTxnType')) + '</th><th>' + this.escape(this.t('hIn')) + '</th><th>' + this.escape(this.t('hOut')) + '</th><th>' + this.escape(this.t('hDate')) + '</th></tr>';
				txnBody.innerHTML = txns.length === 0
					? '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgNoTransactions')) + '</div></td></tr>'
					: txns.slice(0, 150).map((r) =>
						'<tr>' +
						'<td>' + this.escape(r.Tenant_id || '-') + '</td>' +
						'<td>' + this.escape(r.SKU || '-') + '</td>' +
						'<td>' + this.escape(r['Loại giao dịch'] || '-') + '</td>' +
						'<td>' + this.escape(String(r['Số lượng In'] || r.In_qtty || 0)) + '</td>' +
						'<td>' + this.escape(String(r['Số lượng Out'] || r.Out_qtty || 0)) + '</td>' +
						'<td>' + this.formatDate(r.DATE) + '</td>' +
						'</tr>'
					).join('');
			} catch (err) {
				invBody.innerHTML = '<tr><td colspan="6"><div class="state-box" style="color:#b3261e;">' + this.escape(err.message || this.t('toastWmsFailed')) + '</div></td></tr>';
				txnBody.innerHTML = invBody.innerHTML;
			}
		},
		/**
		 * 1 Order chỉ được chọn để ghép TMS khi chưa hoàn thành
		 * và chưa có TMS_Order ID — khớp điều kiện validate fail-fast ở backend,
		 * tránh user chọn rồi bị BE từ chối.
		 */
		isOmsOrderMergeable: function (row) {
			const status = String(this.getRowValue(row, ['Status', 'Trạng thái']) || '').trim();
			const tmsOrderId = this.getRowValue(row, ['TMS_Order ID']);
			return status === 'Lên kế hoạch' && !tmsOrderId;
		},

		isOmsOrderEditable: function (row) {
			const tmsOrderId = this.getRowValue(row, ['TMS_Order ID']);
			return !tmsOrderId;
		},

		handleOmsRowActionClick: function (evt) {
			const viewBtn = evt.target.closest('[data-view-order-id]');
			if (viewBtn) {
				this.openOrderDetailModal(viewBtn.dataset.viewOrderId);
				return;
			}
			const editBtn = evt.target.closest('[data-edit-order-id]');
			if (editBtn) {
				if (editBtn.disabled) return;
				this.openEditOrderModal(editBtn.dataset.editOrderId);
			}
		},

		handleOmsRowCheckboxChange: function (evt) {
			const cb = evt.target.closest('input[type="checkbox"][data-order-id]');
			if (!cb) return;
			const orderId = cb.dataset.orderId;
			if (cb.checked) {
				this.state.omsSelectedIds[orderId] = true;
			} else {
				delete this.state.omsSelectedIds[orderId];
			}
			this.updateOmsMergeToolbar();
		},

		updateOmsMergeToolbar: function () {
			const count = Object.keys(this.state.omsSelectedIds || {}).length;
			const toolbar = document.getElementById('omsMergeToolbar');
			toolbar.style.display = count > 0 ? 'flex' : 'none';
			document.getElementById('omsMergeSelectedCount').textContent = this.formatT('omsMergeSelectedCount', { count: count });
		},

		clearOmsSelection: function () {
			this.state.omsSelectedIds = {};
			document.querySelectorAll('#omsBody input[type="checkbox"][data-order-id]').forEach((cb) => { cb.checked = false; });
			this.updateOmsMergeToolbar();
		},

		openOrderDetailModal: async function (orderId) {

				return String(this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID'])) === String(orderId);

				this.toast(this.t('toastOrderNotFound'), 'error');

				[this.t('hOrderId'), this.getRowValue(row, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID']) || '-'],
				[this.t('hClient'), this.getRowValue(row, ['Client']) || '-'],
				[this.t('hSku'), this.getRowValue(row, ['Mã hàng', 'SKU']) || '-'],
				[this.t('hQty'), this.getRowValue(row, ['Số lượng', 'Qty']) || '-'],
				[this.t('fUom'), this.getRowValue(row, ['UOM']) || '-'],
				[this.t('hFrom'), this.translateLocation(this.getRowValue(row, ['Nơi đi']) || '-')],
				[this.t('hTo'), this.translateLocation(this.getRowValue(row, ['Nơi đến']) || '-')],
				[this.t('hFlock'), this.getRowValue(row, ['FLOCK_ID', 'FLOCK ID', 'Flock ID']) || '-'],

				[this.t('fEtaDate'), this.formatDate(this.getRowValue(row, ['Ngày giao hàng (Dự kiến)']))],
				[this.t('hStatus'), this.displayOrderStatus(this.getRowValue(row, ['Status']) || '-')],
				[this.t('hTmsOrderId'), this.getRowValue(row, ['TMS_Order ID']) || '-'],
				[this.t('hCreateDate'), this.formatDate(this.getRowValue(row, ['Create Date', 'Create date', 'Ngày tạo đơn hàng']))],
				[this.t('labelNote'), this.getRowValue(row, ['Note']) || '-']
			];

			const detailHtml =
				'<div class="table-wrap" style="margin-bottom:10px;">' +
				'<table class="erp-table"><tbody>' +
				detailRows.map((item) => '<tr><th style="width:220px;">' + this.escape(item[0]) + '</th><td>' + this.escape(String(item[1])) + '</td></tr>').join('') +
				'</tbody></table></div>' +
				'<div id="orderTraceBox" class="state-box">' + this.escape(this.t('msgLoadingTransactions')) + '</div>';

			ErpModal.open({
				title: this.t('orderDetailTitle'),
				size: 'lg',
				submitLabel: this.t('commonCancel'),
				bodyHtml: detailHtml,
				onOpen: async () => {
					try {
						const traceResp = await this.rpc('getOrderTraceability', orderId);
						const trace = traceResp.data || {};
						const factoryRows = trace.factory || [];
						const farmRows = trace.farm || [];
						document.getElementById('orderTraceBox').innerHTML =
							'<div style="font-weight:600;margin-bottom:6px;">' + this.escape(this.t('orderTraceTitle')) + '</div>' +
							'<div>' + this.escape(this.t('orderTraceFactory')) + ': <b>' + this.escape(String(factoryRows.length)) + '</b></div>' +
							'<div>' + this.escape(this.t('orderTraceFarm')) + ': <b>' + this.escape(String(farmRows.length)) + '</b></div>';
					} catch (err) {
						document.getElementById('orderTraceBox').innerHTML = '<div style="color:#b3261e;">' + this.escape(err.message || this.t('toastOrderTraceFailed')) + '</div>';
					}
				}
			});

			document.getElementById('erpModalSubmitBtn').style.display = 'none';
		},

		openEditOrderModal: function (orderId) {
			const row = (this.state.omsRows || []).find((r) => {
				return String(this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID'])) === String(orderId);
			});
			if (!row) {
				this.toast(this.t('toastOrderNotFound'), 'error');
				return;
			}

			const locationSet = {};
			const locationOptions = this.state.configs
				.map((c) => String(c['Managed by'] || c.Tenant || '').trim())
				.filter((name) => {
					if (!name) return false;
					const key = name.toLowerCase();
					if (locationSet[key]) return false;
					locationSet[key] = true;
					return true;
				})
				.map((name) => '<option value="' + this.escapeAttr(name) + '">' + this.escape(name) + '</option>')
				.join('');

			const skuOptions = this.state.products.map((p) => {
				const name = String(p['Tên hàng hóa'] || '').trim();
				return '<option value="' + this.escapeAttr(name) + '">' + this.escape(name) + '</option>';
			}).join('');

			const buildFlockOptions = (destinationName, selectedValue) => {
				const normalizedDest = String(destinationName || '').trim().toLowerCase();
				const allFlocks = this.state.configs.filter((c) => String(c.FLOCK_ID || '').trim() !== '');
				const scoped = allFlocks.filter((c) => String(c.Tenant || '').trim().toLowerCase() === normalizedDest);
				const source = scoped.length > 0 ? scoped : allFlocks;
				const options = ['<option value="">' + this.escape(this.t('selectFlock')) + '</option>']
					.concat(source.map((c) => {
						const flockName = String(c.FLOCK_NAME || c.FLOCK_ID || '').trim();
						const flockId = String(c.FLOCK_ID || '').trim();
						const tenantName = String(c.Tenant || '').trim();
						const selected = selectedValue && selectedValue.toLowerCase() === flockName.toLowerCase() ? ' selected' : '';
						return '<option value="' + this.escapeAttr(flockName) + '" data-flock-id="' + this.escapeAttr(flockId) + '"' + selected + '>' +
							this.escape(flockName + ' (' + flockId + ')' + (tenantName ? ' - ' + tenantName : '')) +
							'</option>';
					}))
					.join('');
				return options;
			};

			ErpModal.open({
				title: this.t('orderEditTitle'),
				size: 'lg',
				bodyHtml:
					'<div class="form-grid">' +
					this.formField(this.t('hOrderId'), '<input class="form-control" id="e_order_id" disabled value="' + this.escapeAttr(orderId) + '">') +
					this.formField(this.t('hStatus'), '<select class="form-control" id="e_status">' +
						'<option value="Lên kế hoạch">' + this.escape(this.t('statusPlanned')) + '</option>' +
						'<option value="Đã lấy hàng">' + this.escape(this.t('statusPickedUp')) + '</option>' +
						'<option value="Chờ giao hàng">' + this.escape(this.t('statusInTransit')) + '</option>' +
						'<option value="Hoàn tất">' + this.escape(this.t('statusCompleted')) + '</option>' +
						'</select>') +
					this.formField(this.t('fClient'), '<input class="form-control" id="e_client" value="' + this.escapeAttr(this.getRowValue(row, ['Client']) || '') + '">') +
					this.formField(this.t('fSku'), '<select class="form-control" id="e_sku">' + skuOptions + '</select>') +
					this.formField(this.t('fQty'), '<input class="form-control" id="e_qty" type="number" min="1" value="' + this.escapeAttr(String(this.getRowValue(row, ['Số lượng', 'Qty']) || '')) + '">') +
					this.formField(this.t('fUom'), '<input class="form-control" id="e_uom" value="' + this.escapeAttr(this.getRowValue(row, ['UOM']) || '') + '">') +
					this.formField(this.t('fFrom'), '<select class="form-control" id="e_from">' + locationOptions + '</select>') +
					this.formField(this.t('fTo'), '<select class="form-control" id="e_to">' + locationOptions + '</select>') +
					this.formField(this.t('fFlock'), '<select class="form-control" id="e_flock_name"></select>') +
					this.formField(this.t('fPickupDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="e_pick_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="e_pick" type="date" aria-label="' + this.escapeAttr(this.t('fPickupDate')) + '"></div>') +
					this.formField(this.t('fEtaDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="e_eta_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="e_eta" type="date" aria-label="' + this.escapeAttr(this.t('fEtaDate')) + '"></div>') +
					this.formField(this.t('labelNote'), '<textarea class="form-control" id="e_note" rows="2">' + this.escape(this.getRowValue(row, ['Note']) || '') + '</textarea>', true) +
					'</div>',
				onOpen: () => {
					const skuVal = String(this.getRowValue(row, ['Mã hàng', 'SKU']) || '');
					const mappedProduct = this.state.products.find((p) => String(p.SKU || '').trim().toLowerCase() === skuVal.toLowerCase());
					const productNameVal = mappedProduct ? String(mappedProduct['Tên hàng hóa'] || '').trim() : skuVal;
					const statusVal = String(this.getRowValue(row, ['Status']) || 'Lên kế hoạch');
					const fromVal = String(this.getRowValue(row, ['Nơi đi']) || '');
					const toVal = String(this.getRowValue(row, ['Nơi đến']) || '');
					const flockIdVal = String(this.getRowValue(row, ['FLOCK_ID', 'FLOCK ID', 'Flock ID']) || '');
					const pickVal = this.toIsoDateInput(this.getRowValue(row, ['Ngày lấy hàng']));
					const etaVal = this.toIsoDateInput(this.getRowValue(row, ['Ngày giao hàng (Dự kiến)']));
					const skuEl = document.getElementById('e_sku');
					const statusEl = document.getElementById('e_status');
					const fromEl = document.getElementById('e_from');
					const toEl = document.getElementById('e_to');
					const flockEl = document.getElementById('e_flock_name');
					const pickEl = document.getElementById('e_pick');
					const etaEl = document.getElementById('e_eta');
					if (skuEl) skuEl.value = productNameVal;
					if (statusEl) statusEl.value = statusVal;
					if (fromEl) fromEl.value = fromVal;
					if (toEl) toEl.value = toVal;
					if (flockEl) {
						const allFlocks = this.state.configs.filter((c) => String(c.FLOCK_ID || '').trim() !== '');
						const matchedFlock = allFlocks.find((c) => String(c.FLOCK_ID || '').trim() === flockIdVal);
						const initialFlockName = matchedFlock ? String(matchedFlock.FLOCK_NAME || matchedFlock.FLOCK_ID || '').trim() : '';
						const renderFlockOptions = () => {
							flockEl.innerHTML = buildFlockOptions(toEl ? toEl.value : '', initialFlockName);
						};
						renderFlockOptions();
						if (toEl) {
							toEl.addEventListener('change', () => {
								flockEl.innerHTML = buildFlockOptions(toEl.value, '');
							});
						}
					}
					if (pickEl) pickEl.value = pickVal;
					if (etaEl) etaEl.value = etaVal;
					this.bindDateDisplayProxy('e_pick', 'e_pick_display');
					this.bindDateDisplayProxy('e_eta', 'e_eta_display');
				},
				onSubmit: async () => {
					try {
						ErpModal.setSubmitting(true);
						const targetStatus = this.value('e_status');
						const currentStatus = String(this.getRowValue(row, ['Status']) || '').trim();
						const payload = {
							Client: this.value('e_client'),
							'Mã hàng': this.value('e_sku'),
							'Số lượng': Number(this.value('e_qty')),
							UOM: this.value('e_uom'),
							'Nơi đi': this.value('e_from'),

			const btn = evt.target.closest('[data-page]');
			if (!btn) return;

			if (!Number.isFinite(page) || page < 1) return;

		sortFmsRowsBySeverity: function (rows) {
			return rows.slice().sort((a, b) => {
				const rankDiff = this.thresholdSeverityRank(b['Inventory Thresholds']) - this.thresholdSeverityRank(a['Inventory Thresholds']);
				if (rankDiff !== 0) return rankDiff;
				return this.toUnixTime(b.DATE) - this.toUnixTime(a.DATE);
			});
		},

		thresholdSeverityRank: function (badge) {
			const map = {
				Critical: 5,
				High: 4,
				Low: 3,
				Safe: 2,
				Zero: 1
			};
			return map[String(badge || '')] || 0;
		},

		toUnixTime: function (value) {
			if (!value) return 0;
			const parsed = new Date(value).getTime();
			if (Number.isFinite(parsed)) return parsed;
			if (typeof value === 'string') {
				const match = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
				if (match) {
					const dd = Number(match[1]);
					const mm = Number(match[2]);
					const yyyy = Number(match[3]);
					const fallback = new Date(yyyy, mm - 1, dd).getTime();
					return Number.isFinite(fallback) ? fallback : 0;
				}
			}
			return 0;
		},

		renderFmsLogPage: function () {
			const rows = this.state.fmsLogRows || [];
			const body = document.getElementById('fmsBody');
			const pagination = document.getElementById('fmsLogPagination');
			if (rows.length === 0) {
				body.innerHTML = '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgNoFmsData')) + '</div></td></tr>';
				pagination.innerHTML = '';
				return;
			}

			const pageSize = Number(this.state.fmsLogPageSize) || 20;
			const total = rows.length;
			const totalPages = Math.max(1, Math.ceil(total / pageSize));
			let page = Number(this.state.fmsLogPage) || 1;
			if (page > totalPages) page = totalPages;
			if (page < 1) page = 1;
			this.state.fmsLogPage = page;

			const start = (page - 1) * pageSize;
			const end = Math.min(start + pageSize, total);
			const pageRows = rows.slice(start, end);

			body.innerHTML = pageRows.map((r) =>
				'<tr>' +
				'<td>' + this.formatDate(r.DATE) + '</td>' +
				'<td>' + this.escape(String(r['Ngày Tuổi'] || '')) + '</td>' +
				'<td>' + this.escape(String(r.MORT_act || 0)) + '</td>' +
				'<td>' + this.escape(String(r.POPULATION_act || '')) + '</td>' +
				'<td>' + this.escape(String(r.POPULATION_est || '')) + '</td>' +
				'<td>' + this.escape(String(this.getRowValue(r, ['FEED_QTY_USE_est', 'FEED_est', 'FEED_USE_est', 'Feed_est']) || '')) + '</td>' +
				'</tr>'
			).join('');

			const info = this.formatT('paginationInfo', {
				from: start + 1,
				to: end,
				total: total
			});

			let startPage = Math.max(1, page - 2);
			let endPage = Math.min(totalPages, startPage + 4);
			startPage = Math.max(1, endPage - 4);

			const pageButtons = [];
			for (let p = startPage; p <= endPage; p++) {
				pageButtons.push('<button class="page-btn ' + (p === page ? 'is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
			}

			pagination.innerHTML =
				'<div>' + this.escape(info) + '</div>' +
				'<div class="pagination-controls">' +
				'<button class="page-btn" data-page="' + (page - 1) + '" ' + (page <= 1 ? 'disabled' : '') + '>' + this.escape(this.t('pagePrev')) + '</button>' +
				pageButtons.join('') +
				'<button class="page-btn" data-page="' + (page + 1) + '" ' + (page >= totalPages ? 'disabled' : '') + '>' + this.escape(this.t('pageNext')) + '</button>' +
				'</div>';
		},

					const age = getFeedValue(r, ['Ngày Tuổi', 'Age']);
					if (selectedFeedChicken && chicken !== selectedFeedChicken) return false;
					if (selectedFeedType && feedType !== selectedFeedType) return false;
					if (feedAgeFilterRaw === '') return true;
					const ageNum = Number(age);
					if (!isFinite(ageNum) || !isFinite(feedAgeFilterNum)) return false;
					return ageNum === feedAgeFilterNum;
				});

				const blockOptions = [
					{ value: 'transport', label: this.t('setupBlockTransport') },
					{ value: 'factory', label: this.t('setupBlockFactory') },
					{ value: 'farm', label: this.t('setupBlockFarm') },
					{ value: 'flock', label: this.t('setupBlockFlock') }
				];
				if (blockFilterEl) {
					blockFilterEl.innerHTML = blockOptions.map((o) => '<option value="' + this.escapeAttr(o.value) + '">' + this.escape(o.label) + '</option>').join('');
					blockFilterEl.value = blockOptions.some((o) => o.value === prevBlock) ? prevBlock : 'factory';
				}
				const selectedBlock = blockFilterEl ? String(blockFilterEl.value || 'factory') : 'factory';
				if (tenantWrapEl) tenantWrapEl.style.display = selectedBlock === 'factory' ? 'none' : '';
				if (tenantIdWrapEl) tenantIdWrapEl.style.display = selectedBlock === 'farm' ? 'none' : '';

				const blockRows = configs.filter((r) => {
					const system = String(r.SYSTEM || '').trim();
					if (selectedBlock === 'transport') return system === 'TMS';
					if (selectedBlock === 'factory') return (system === 'OMS' || system === 'WMS') && isFactoryTenant(r);
					if (selectedBlock === 'farm') return system === 'WMS' && !isFactoryTenant(r);
					if (selectedBlock === 'flock') return system === 'FMS';
					return true;
				});

				const systems = uniqueSorted(blockRows, (r) => String(r.SYSTEM || '').trim());
				if (systemFilterEl) {
					systemFilterEl.innerHTML = systems.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>').join('');
					if (systems.indexOf(prevSystem) !== -1) {
						systemFilterEl.value = prevSystem;
					} else {
						systemFilterEl.value = systems[0] || '';
					}
				}

				const selectedSystem = systemFilterEl ? String(systemFilterEl.value || '') : '';
				const systemRows = blockRows.filter((r) => String(r.SYSTEM || '').trim() === selectedSystem);

				const tenantNames = uniqueSorted(systemRows, (r) => String(r.Tenant || '').trim());
				if (tenantFilterEl) {
					tenantFilterEl.innerHTML = ['<option value="">' + this.escape(this.t('allTenantNames')) + '</option>']
						.concat(tenantNames.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>'))
						.join('');
					tenantFilterEl.value = selectedBlock === 'factory'
						? ''
						: (tenantNames.indexOf(prevTenant) !== -1 ? prevTenant : '');
				}
				const selectedTenant = selectedBlock === 'factory'
					? ''
					: (tenantFilterEl ? String(tenantFilterEl.value || '') : '');

				const tenantRows = selectedTenant
					? systemRows.filter((r) => String(r.Tenant || '').trim() === selectedTenant)
					: systemRows;

				const tenantIds = uniqueSorted(tenantRows, (r) => String(r.Tenant_id || '').trim());
				if (tenantIdFilterEl) {
					tenantIdFilterEl.innerHTML = ['<option value="">' + this.escape(this.t('allTenantIds')) + '</option>']
						.concat(tenantIds.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>'))
						.join('');
					tenantIdFilterEl.value = selectedBlock === 'farm'
						? ''
						: (tenantIds.indexOf(prevTenantId) !== -1 ? prevTenantId : '');
				}
				const selectedTenantId = selectedBlock === 'farm'
					? ''
					: (tenantIdFilterEl ? String(tenantIdFilterEl.value || '') : '');

				const tenantIdRows = selectedTenantId
					? tenantRows.filter((r) => String(r.Tenant_id || '').trim() === selectedTenantId)
					: tenantRows;

				const addresses = uniqueSorted(tenantIdRows, (r) => String(r['Address of Tenant'] || '').trim());
				if (addressFilterEl) {
					addressFilterEl.innerHTML = ['<option value="">' + this.escape(this.t('allAddresses')) + '</option>']
						.concat(addresses.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>'))
						.join('');
					addressFilterEl.value = addresses.indexOf(prevAddress) !== -1 ? prevAddress : '';
				}
				const selectedAddress = addressFilterEl ? String(addressFilterEl.value || '') : '';

				let filteredConfigs = tenantIdRows;
				if (selectedAddress) {
					filteredConfigs = filteredConfigs.filter((r) => String(r['Address of Tenant'] || '').trim() === selectedAddress);
				}

				const isFarmBlock = selectedBlock === 'farm';
				const isFlockBlock = selectedBlock === 'flock';
				if (flockIdWrap) flockIdWrap.style.display = isFarmBlock ? '' : 'none';
				if (flockNameWrap) flockNameWrap.style.display = isFarmBlock ? '' : 'none';

				if (isFarmBlock) {
					const expandedRows = [];
					filteredConfigs.forEach((cfgRow) => {
						const cfgTenantKey = normalizeTenantId(cfgRow.Tenant_id);
						const cfgManagedBy = normalizeText(cfgRow['Managed by']);
						const cfgAddress = normalizeText(cfgRow['Address of Tenant']);
						const cfgFarmNo = extractFarmNo(cfgRow.Tenant_id, 'wms');

						const relatedFlocks = flockRows.filter((f) => {
							const fTenantIdKey = normalizeTenantId(f.Tenant_id);
							if (fTenantIdKey === cfgTenantKey) return true;

							const fManagedBy = normalizeText(f['Managed by']);
							if (cfgManagedBy && fManagedBy && fManagedBy.indexOf(cfgManagedBy) === 0) return true;

							const fAddress = normalizeText(f['Address of Tenant']);
							if (cfgAddress && fAddress && fAddress === cfgAddress) return true;

							const fFarmNo = extractFarmNo(f.Tenant_id, 'flock');
							if (cfgFarmNo && fFarmNo && cfgFarmNo === fFarmNo) return true;

							return false;
						});

						const dedup = {};
						const uniqueFlocks = relatedFlocks.filter((f) => {
							const k = getFlockId(f) + '|' + getFlockName(f);
							if (dedup[k]) return false;
							dedup[k] = true;
							return true;
						});
						if (uniqueFlocks.length === 0) {
							expandedRows.push(Object.assign({}, cfgRow, {
								__flockId: getFlockId(cfgRow),
								__flockName: getFlockName(cfgRow)
							}));
							return;
						}
						uniqueFlocks.forEach((f) => {
							expandedRows.push(Object.assign({}, cfgRow, {
								__flockId: getFlockId(f) || getFlockId(cfgRow),
								__flockName: getFlockName(f) || getFlockName(cfgRow)
							}));
						});
					});

					const flockIds = uniqueSorted(expandedRows, (r) => String(r.__flockId || '').trim());
					if (flockIdFilterEl) {
						flockIdFilterEl.innerHTML = ['<option value="">' + this.escape(this.t('allFlockIds')) + '</option>']
							.concat(flockIds.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>'))
							.join('');
						flockIdFilterEl.value = flockIds.indexOf(prevFlockId) !== -1 ? prevFlockId : '';
					}
					filteredConfigs = expandedRows;
					const selectedFlockId = flockIdFilterEl ? String(flockIdFilterEl.value || '') : '';
					if (selectedFlockId) {
						filteredConfigs = filteredConfigs.filter((r) => String(r.__flockId || '').trim() === selectedFlockId);
					}

					const flockNames = uniqueSorted(filteredConfigs, (r) => String(r.__flockName || '').trim());
					if (flockNameFilterEl) {
						flockNameFilterEl.innerHTML = ['<option value="">' + this.escape(this.t('allFlockNames')) + '</option>']
							.concat(flockNames.map((v) => '<option value="' + this.escapeAttr(v) + '">' + this.escape(v) + '</option>'))
							.join('');
						flockNameFilterEl.value = flockNames.indexOf(prevFlockName) !== -1 ? prevFlockName : '';
					}
					const selectedFlockName = flockNameFilterEl ? String(flockNameFilterEl.value || '') : '';
					if (selectedFlockName) {
						filteredConfigs = filteredConfigs.filter((r) => String(r.__flockName || '').trim() === selectedFlockName);
					}
				}

				filteredConfigs = filteredConfigs.slice().sort((a, b) => {
					const tenantCmp = String(a.Tenant || '').localeCompare(String(b.Tenant || ''));
					if (tenantCmp !== 0) return tenantCmp;
					const tenantIdCmp = String(a.Tenant_id || '').localeCompare(String(b.Tenant_id || ''));
					if (tenantIdCmp !== 0) return tenantIdCmp;
					return String(a['Address of Tenant'] || '').localeCompare(String(b['Address of Tenant'] || ''));
				});

				const configHeaderCols = isFarmBlock
					? ['hSystem', 'hTenant', 'hAddress', 'hFlock', 'hFlockName']
					: (isFlockBlock
						? ['hSystem', 'hTenant', 'tenant_id', 'hAddress', 'hStartFlockCount', 'hStartFlockDate']
						: ['hSystem', 'hTenant', 'tenant_id', 'hAddress']);

				document.getElementById('setupConfigHead').innerHTML = '<tr><th style="width:44px"></th>' + configHeaderCols.map((key) => {
					if (key === 'tenant_id') return '<th>Tenant_id</th>';
					return '<th>' + this.escape(this.t(key)) + '</th>';
				}).join('') + '</tr>';

				document.getElementById('setupConfigBody').innerHTML = filteredConfigs.length === 0
					? '<tr><td colspan="' + (configHeaderCols.length + 1) + '"><div class="state-box">' + this.escape(this.t('msgNoConfig')) + '</div></td></tr>'
					: filteredConfigs.slice(0, 120).map((r) => {
						const editPayload = this.escapeAttr(JSON.stringify({
							__block: selectedBlock,
							SYSTEM: r.SYSTEM || '',
							Tenant: r.Tenant || '',
							Tenant_id: r.Tenant_id || '',
							Managed_by: r['Managed by'] || '',
							Address_of_Tenant: r['Address of Tenant'] || '',
							FLOCK_ID: r.__flockId || r.FLOCK_ID || '',
							FLOCK_NAME: r.__flockName || r.FLOCK_NAME || '',
							Standards_applied: r['Standards applied'] || '',
							Start_flock_count: r.Start_flock_count || '',
							Start_flock_date: r.Start_flock_date || ''
						}));
						const editBtn = '<button type="button" class="btn-icon" data-edit-config="' + editPayload + '" title="Edit"><span class="material-symbols-outlined">edit</span></button>';
						const cells = isFarmBlock
							? [
								this.escape(r.SYSTEM || '-'),
								this.escape(r.Tenant || '-'),
								this.escape(r['Address of Tenant'] || '-'),
							]
							: [
								this.escape(r.SYSTEM || '-'),
								this.escape(r.Tenant || '-'),
								this.escape(r.Tenant_id || '-'),
								this.escape(r['Address of Tenant'] || '-'),
							];
						if (isFarmBlock) {
							cells.push(this.escape(r.__flockId || r.FLOCK_ID || '-'));
							cells.push(this.escape(r.__flockName || r.FLOCK_NAME || '-'));
						}
						if (isFlockBlock) {
							cells.push(this.escape(String(r.Start_flock_count || '-')));
							cells.push(this.escape(this.formatDate(r.Start_flock_date)));
						}
						return '<tr><td>' + editBtn + '</td>' + cells.map((c) => '<td>' + c + '</td>').join('') + '</tr>';
					}).join('');

				document.getElementById('setupProductHead').innerHTML = '<tr><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hProductName')) + '</th><th>UOM</th><th>' + this.escape(this.t('hStatus')) + '</th></tr>';
				document.getElementById('setupProductBody').innerHTML = products.length === 0
					? '<tr><td colspan="4"><div class="state-box">' + this.escape(this.t('msgNoProduct')) + '</div></td></tr>'
					: products.slice(0, 120).map((r) => '<tr><td>' + this.escape(r.SKU || '') + '</td><td>' + this.escape(r['Tên hàng hóa'] || '') + '</td><td>' + this.escape(r.UOM || '') + '</td><td>' + this.escape(r.Status || '') + '</td></tr>').join('');

				const feedColumnsRaw = [];
				const feedColumnSeen = {};
				(feedRows.length > 0 ? feedRows : filteredFeed).forEach((row) => {
					Object.keys(row || {}).forEach((col) => {
						const key = String(col || '').trim();
						if (!key || key.indexOf('__') === 0 || feedColumnSeen[key]) return;
						feedColumnSeen[key] = true;
						feedColumnsRaw.push(key);
					});
				});

				const preferredFeedOrder = [
					'Loại Gà',
					'Ngày Tuổi',
					'TĂ sử dụng (g/c/n)',
					'Thức ăn sử dụng cộng dồn (g/c)',
					'Hệ số sử dụng thức ăn',
					'Hao hụt cộng dồn',
					'Bình quân khối lượng cơ thể (g)',
					'Loại cám',
					'Age',
					'FC (g/b/d)',
					'Cum. Feed (g)',
					'FCR',
					'Cum. Dep (%)',
					'BW (gr)'
				];

				const feedColumns = preferredFeedOrder.filter((c) => feedColumnSeen[c]).concat(
					feedColumnsRaw.filter((c) => preferredFeedOrder.indexOf(c) === -1)
				);

				const feedHeaderKeyMap = {
					'Loại Gà': 'fChickenType',
					'Ngày Tuổi': 'hAge',
					'TĂ sử dụng (g/c/n)': 'fFeedUse',
					'Thức ăn sử dụng cộng dồn (g/c)': 'hCumFeed',
					'Hệ số sử dụng thức ăn': 'hFcr',
					'Hao hụt cộng dồn': 'hCumDep',
					'Bình quân khối lượng cơ thể (g)': 'hBodyWeight',
					'Loại cám': 'fFeedType',
					'Age': 'hAge',
					'FC (g/b/d)': 'fFeedUse',
					'Cum. Feed (g)': 'hCumFeed',
					'FCR': 'hFcr',
					'Cum. Dep (%)': 'hCumDep',
					'BW (gr)': 'hBodyWeight'
				};

				document.getElementById('setupFeedHead').innerHTML = '<tr>' + feedColumns.map((c) => {
					const key = feedHeaderKeyMap[c];
					const label = key ? this.t(key) : c;
					return '<th>' + this.escape(label) + '</th>';
				}).join('') + '</tr>';
				const feedPrecisionMap = {
					'Ngày Tuổi': 0,
					'Age': 0,
					'TĂ sử dụng (g/c/n)': 1,
					'FC (g/b/d)': 1,
					'Thức ăn sử dụng cộng dồn (g/c)': 0,
					'Cum. Feed (g)': 0,
					'Hệ số sử dụng thức ăn': 3,
					'FCR': 3,
					'Hao hụt cộng dồn': 2,
					'Cum. Dep (%)': 2,
					'Bình quân khối lượng cơ thể (g)': 0,
					'BW (gr)': 0,
				};
				const formatFeedCell = (col, raw) => {
					if (raw === undefined || raw === null || raw === '') return '';
					const precision = feedPrecisionMap[col];
					if (precision === undefined) return String(raw);
					const num = Number(raw);
					if (!isFinite(num)) return String(raw);
					if (precision === 0) {
						return num.toLocaleString('en-US', { maximumFractionDigits: 0 });
					}
					return num.toLocaleString('en-US', {
						minimumFractionDigits: precision,
						maximumFractionDigits: precision,
					});
				};
				const feedPageSize = this.state.setupFeedPageSize || 20;
				const feedTotal = filteredFeed.length;
				const feedTotalPages = Math.max(1, Math.ceil(feedTotal / feedPageSize));
				let feedPage = this.state.setupFeedPage || 1;
				if (feedPage > feedTotalPages) feedPage = feedTotalPages;
				if (feedPage < 1) feedPage = 1;
				this.state.setupFeedPage = feedPage;
				const feedStart = (feedPage - 1) * feedPageSize;
				const feedRowsPage = filteredFeed.slice(feedStart, feedStart + feedPageSize);

				document.getElementById('setupFeedBody').innerHTML = feedTotal === 0
					? '<tr><td colspan="' + Math.max(feedColumns.length, 1) + '"><div class="state-box">' + this.escape(this.t('msgNoFeedMatch')) + '</div></td></tr>'
					: feedRowsPage.map((r) =>
						'<tr>' + feedColumns.map((c) => '<td>' + this.escape(formatFeedCell(c, r[c])) + '</td>').join('') + '</tr>'
					).join('');

				document.getElementById('setupFeedPagination').innerHTML = this.renderSimplePagination(feedTotal, feedPageSize, feedPage);

				document.getElementById('setupPolicyHead').innerHTML = '<tr><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hZero')) + '</th><th>' + this.escape(this.t('hCritical')) + '</th><th>' + this.escape(this.t('hLow')) + '</th><th>' + this.escape(this.t('hHigh')) + '</th><th>' + this.escape(this.t('hStatus')) + '</th><th>' + this.escape(this.t('hNote')) + '</th><th>' + this.escape(this.t('hAction')) + '</th></tr>';
				document.getElementById('setupPolicyBody').innerHTML = filteredPolicy.length === 0
					? '<tr><td colspan="8"><div class="state-box">' + this.escape(this.t('msgNoPolicyMatch')) + '</div></td></tr>'
					: filteredPolicy.slice(0, 160).map((r, idx) => {
						const key = 'pol_' + idx + '_' + this.escapeAttr(String(r['Mã hàng'] || ''));
						return '<tr>' +
							'<td>' + this.escape(r['Mã hàng'] || '') + '</td>' +
							'<td>' + this.escape(String(r.zero_threshold || '')) + '</td>' +
							'<td>' + this.escape(String(r.critical_threshold || '')) + '</td>' +
							'<td>' + this.escape(String(r.low_threshold || '')) + '</td>' +
							'<td>' + this.escape(String(r.high_threshold || '')) + '</td>' +
							'<td><select id="' + key + '_status" class="form-control"><option value="active" ' + (String(r.status || '').toLowerCase() === 'active' ? 'selected' : '') + '>' + this.escape(this.t('statusActive')) + '</option><option value="inactive" ' + (String(r.status || '').toLowerCase() === 'inactive' ? 'selected' : '') + '>' + this.escape(this.t('statusInactive')) + '</option></select></td>' +
							'<td><input id="' + key + '_note" class="form-control" value="' + this.escapeAttr(r.note || '') + '"></td>' +
							'<td><button class="btn btn-outline btn-sm" data-save-policy="' + this.escapeAttr(JSON.stringify({
								sku: r['Mã hàng'],
								zero: r.zero_threshold,
								critical: r.critical_threshold,
								low: r.low_threshold,
								high: r.high_threshold,
								key: key
							})) + '">' + this.escape(this.t('commonSave')) + '</button></td>' +
							'</tr>';
					}).join('');
				this.state.loadedViews.setup = true;
			} catch (err) {
				this.toast(err.message || this.t('toastSetupFailed'), 'error');
			}
		},

		openCreateOrderModal: function () {
			const locationSet = {};
			const locationOptions = this.state.configs
				.map((c) => String(c['Managed by'] || c.Tenant || '').trim())
				.filter((name) => {
					if (!name) return false;
					const key = name.toLowerCase();
					if (locationSet[key]) return false;
					locationSet[key] = true;
					return true;
				})
				.map((name) => '<option>' + this.escape(name) + '</option>')
				.join('');

				.join('');

			ErpModal.open({

				size: 'lg',
				bodyHtml:

					this.formField(this.t('fTenantId'), '<select class="form-control" id="m_tenant">' + tenantOptions + '</select>') +
					this.formField(this.t('fClient'), '<input class="form-control" id="m_client">') +
					this.formField(this.t('fProductName'), '<select class="form-control" id="m_product_name">' + productNameOptions + '</select>') +
					this.formField(this.t('fQty'), '<input class="form-control" id="m_qty" type="number" min="1">') +
					this.formField(this.t('fUom'), '<input class="form-control" id="m_uom" value="Bag">') +
					this.formField(this.t('fFrom'), '<select class="form-control" id="m_from">' + locationOptions + '</select>') +
					this.formField(this.t('fTo'), '<select class="form-control" id="m_to">' + locationOptions + '</select>') +
					this.formField(this.t('fFlock'), '<select class="form-control" id="m_flock_name"></select>') +
					this.formField(this.t('fPickupDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="m_pick_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="m_pick" type="date" aria-label="' + this.escapeAttr(this.t('fPickupDate')) + '"></div>') +
					this.formField(this.t('fEtaDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="m_eta_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="m_eta" type="date" aria-label="' + this.escapeAttr(this.t('fEtaDate')) + '"></div>') +
					this.formField(this.t('labelNote'), '<textarea class="form-control" id="m_note" rows="2"></textarea>', true) +
					'</div>',
				onSubmit: async (btn) => {
					try {
						ErpModal.setSubmitting(true);
						const selectedProductName = this.value('m_product_name');
						const selectedProduct = this.state.products.find((p) =>
							String(p['Tên hàng hóa'] || '').trim().toLowerCase() === selectedProductName.toLowerCase()
						);
						const payload = {
							Tenant_id: this.value('m_tenant'),
							Client: this.value('m_client'),
							'Mã hàng': selectedProduct ? String(selectedProduct['Tên hàng hóa'] || '') : selectedProductName,
							'Số lượng': Number(this.value('m_qty')),
							UOM: this.value('m_uom') || (selectedProduct ? String(selectedProduct.UOM || '') : '') || 'Bag',
							'Nơi đi': this.value('m_from'),
							'Nơi đến': this.value('m_to'),
							FLOCK_NAME: this.value('m_flock_name'),
							'Ngày lấy hàng': this.value('m_pick'),
							'Ngày giao hàng (Dự kiến)': this.value('m_eta'),
							Note: this.value('m_note')
						};
						await this.rpc('createOrder', payload);
						ErpModal.close();
						this.toast(this.t('toastCreateOrderOk'), 'success');
						this.loadOms(true);
						this.loadDashboard(true);
					} catch (err) {
						this.toast(err.message || this.t('toastCreateOrderFailed'), 'error');
					} finally {
						ErpModal.setSubmitting(false);
					}
				}
			});

			setTimeout(() => {
				const toEl = document.getElementById('m_to');
				const flockEl = document.getElementById('m_flock_name');
				const renderCreateFlockOptions = () => {
					if (!flockEl) return;
					const destination = toEl ? toEl.value : '';

					const scoped = allFlocks.filter((c) => String(c.Tenant || '').trim().toLowerCase() === normalizedDest);
