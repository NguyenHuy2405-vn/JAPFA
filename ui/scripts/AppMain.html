<script>
	google.charts.load('current', { packages: ['corechart'] });
	google.charts.setOnLoadCallback(function () {
		window.__gchartsReady = true;
		if (window.__chartQueue) {
			window.__chartQueue.forEach(function (fn) { fn(); });
			window.__chartQueue = [];
		}
	});

	const App = {
		state: {
			user: null,
			lang: 'vi',
			activeView: 'dashboard',
			loadedViews: {},
			configs: [],
			products: [],
			flocks: [],
			loaiGa: [],
			fmsLogRows: [],
			fmsLogPage: 1,
			fmsLogPageSize: 20,
			dashboardAlertWindowDays: 7,
			dashboardAlertItems: [],
			dashboardAlertFarm: '',
      omsRows: [],
			omsSelectedIds: {}
		},

		init: async function () {
			this.state.lang = this.getPreferredLang();
			this.injectLogo();
			this.bindEvents();
			this.applyLanguage();
			this.renderLoadingState();
			try {
				await this.loadBootstrap();
				this.switchView('dashboard');
				await this.refreshActiveView();
			} catch (err) {
				this.toast(err.message || this.t('toastInitFailed'), 'error');
			}
		},

		bindEvents: function () {
			document.getElementById('btnLang').addEventListener('click', (evt) => {
				evt.stopPropagation();
				const menu = document.getElementById('langMenu');
				const isOpen = menu.classList.toggle('is-open');
				document.getElementById('btnLang').setAttribute('aria-expanded', isOpen ? 'true' : 'false');
			});
	document.getElementById('omsBody').addEventListener('change', (evt) => this.handleOmsRowCheckboxChange(evt));
	document.getElementById('omsBody').addEventListener('click', (evt) => this.handleOmsRowActionClick(evt));
      document.getElementById('btnOmsMergeSuggest').addEventListener('click', () => this.openOrderMergeSuggestModal());
	document.getElementById('btnOmsAssignTmsAll').addEventListener('click', () => this.assignTmsForAllUnfinishedOrders());
      document.getElementById('btnOmsMergeSelected').addEventListener('click', () => this.mergeSelectedOrdersToTms());
      document.getElementById('btnOmsClearSelection').addEventListener('click', () => this.clearOmsSelection());
			document.querySelectorAll('#langMenu [data-lang]').forEach((btn) => {
				btn.addEventListener('click', () => {
					this.setLanguage(btn.dataset.lang);
					const menu = document.getElementById('langMenu');
					menu.classList.remove('is-open');
					document.getElementById('btnLang').setAttribute('aria-expanded', 'false');
				});
			});

			document.addEventListener('click', (evt) => {
				const wrap = document.getElementById('langSwitch');
				if (!wrap.contains(evt.target)) {
					document.getElementById('langMenu').classList.remove('is-open');
					document.getElementById('btnLang').setAttribute('aria-expanded', 'false');
				}
			});

			document.getElementById('mainTabs').addEventListener('click', (evt) => {
				const btn = evt.target.closest('.nav-tab');
				if (!btn) return;
				this.switchView(btn.dataset.view);
				this.refreshActiveView();
			});

			document.getElementById('btnOmsRefresh').addEventListener('click', () => this.loadOms(true));
			document.getElementById('btnWmsRefresh').addEventListener('click', () => this.loadWms(true));
			document.getElementById('btnFmsRefresh').addEventListener('click', () => this.loadFms(true));

			document.getElementById('omsStatusFilter').addEventListener('change', () => this.loadOms(true));
			document.getElementById('omsSearch').addEventListener('input', () => this.loadOms(true));
			document.getElementById('wmsScopeFilter').addEventListener('change', () => this.updateWmsScopeUi());
			document.getElementById('wmsTenantFilter').addEventListener('change', () => this.loadWms(true));
			document.getElementById('fmsFlockFilter').addEventListener('change', () => this.loadFms(true));
			document.getElementById('fmsLogPagination').addEventListener('click', (evt) => this.handleFmsLogPaginationClick(evt));

			document.getElementById('btnCreateOrder').addEventListener('click', () => this.openCreateOrderModal());
			document.getElementById('btnWmsInbound').addEventListener('click', () => this.openTxnModal('Inbound'));
			document.getElementById('btnWmsOutbound').addEventListener('click', () => this.openTxnModal('Outbound'));
			document.getElementById('btnWmsAdjust').addEventListener('click', () => this.openAdjustModal());

			document.getElementById('btnSetupConfig').addEventListener('click', () => this.openSetupConfigModal());
			document.getElementById('btnSetupProduct').addEventListener('click', () => this.openSetupProductModal());
			document.getElementById('btnSetupFeed').addEventListener('click', () => this.openSetupFeedModal());
			document.getElementById('btnSetupPolicy').addEventListener('click', () => this.openSetupPolicyModal());

			document.getElementById('setupFeedSearch').addEventListener('input', () => this.loadSetup(true));
			document.getElementById('setupPolicySearch').addEventListener('input', () => this.loadSetup(true));
			document.getElementById('setupPolicyBody').addEventListener('click', (evt) => {
				const btn = evt.target.closest('[data-save-policy]');
				if (!btn) return;
				this.savePolicyInline(btn.dataset.savePolicy);
			});

			document.getElementById('dashboardAlertFarmFilter').addEventListener('change', (evt) => {
				this.state.dashboardAlertFarm = String(evt.target.value || '');
				this.renderDashboardAlertTable({
					items: this.state.dashboardAlertItems,
					days: this.state.dashboardAlertWindowDays
				});
			});

		},

		renderLoadingState: function () {
			document.getElementById('dashboardKpis').innerHTML = '<div class="state-box card" style="grid-column:1/-1;">' + this.escape(this.t('msgLoadingDashboard')) + '</div>';
		},

		loadBootstrap: async function () {
			const user = await this.callRaw('getCurrentUserProfile');
			const [configsResp, productsResp, flocksResp, loaiGaResp] = await Promise.all([
				this.rpc('getConfigList'),
				this.rpc('getProductMasterList'),
				this.rpc('getFlockList'),
				this.rpc('getDistinctLoaiGa')
			]);

			this.state.user = user;
			this.state.configs = configsResp.data || [];
			this.state.products = (productsResp.data || []).filter((p) => String(p.Status || '').toUpperCase() === 'ACTIVE');
			this.state.flocks = flocksResp.data || [];
			this.state.loaiGa = loaiGaResp.data || [];

			this.renderUserChip();
			this.applyRoleBasedViewAccess();

			this.fillTenantOptions();
			this.fillFlockOptions();
		},

		injectLogo: function () {
			if (window.JAPFA_LOGO_DATA) {
				document.getElementById('brandLogo').src = window.JAPFA_LOGO_DATA;
			}
		},

		getPreferredLang: function () {
			try {
				const saved = localStorage.getItem('japfa_lang');
				if (saved === 'vi' || saved === 'en') return saved;
			} catch (e) {
				// ignore storage read failures
			}
			return 'vi';
		},

		setLanguage: function (lang) {
			if (lang !== 'vi' && lang !== 'en') return;
			this.state.lang = lang;
			this.applyLanguage();
			this.renderUserChip();
			this.refreshActiveView(true);
			try {
				localStorage.setItem('japfa_lang', lang);
			} catch (e) {
				// ignore storage write failures
			}
		},

		applyLanguage: function () {
			const lang = this.state.lang === 'en' ? 'en' : 'vi';
			const dict = I18N[lang] || I18N.vi;
			document.documentElement.lang = lang;
			document.getElementById('brandContext').textContent = dict.brandContext;
			this.applyStaticTranslations();
			this.fillTenantOptions();
			this.fillFlockOptions();
			document.getElementById('langCurrent').textContent = lang.toUpperCase();
			document.querySelectorAll('#langMenu [data-lang]').forEach((btn) => {
				btn.classList.toggle('is-active', btn.dataset.lang === lang);
			});
			if (!this.state.user) {
				document.getElementById('userChip').innerHTML = '<span class="material-symbols-outlined">person</span>' + this.escape(dict.loadingUser);
			}
		},

		t: function (key) {
			const lang = this.state.lang === 'en' ? 'en' : 'vi';
			const dict = I18N[lang] || I18N.vi;
			return dict[key] || I18N.vi[key] || key;
		},

		formatT: function (key, params) {
			let text = this.t(key);
			if (!params) return text;
			Object.keys(params).forEach((k) => {
				text = text.replace(new RegExp('\\{' + k + '\\}', 'g'), String(params[k]));
			});
			return text;
		},

		applyStaticTranslations: function () {
			const map = {
				navDashboardLabel: 'navDashboard',
				navOmsLabel: 'navOms',
				navWmsLabel: 'navWms',
				navFmsLabel: 'navFms',
				navSetupLabel: 'navSetup',
				dashboardTitle: 'dashboardTitle',
				dashboardDesc: 'dashboardDesc',
				dashboardOrderPieTitle: 'dashboardOrderPieTitle',
				dashboardOrderPieEmptyText: 'dashboardOrderPieEmpty',
				dashboardAlertTitle: 'dashboardAlertTitle',
				dashboardAlertFarmFilterLabel: 'dashboardAlertFlockFilterLabel',
				omsTitle: 'omsTitle',
				omsDesc: 'omsDesc',
				omsFactoryTitle: 'wmsScopeFactory',
				omsFactoryInventoryTitle: 'wmsInventoryTitle',
				omsFactoryTxnTitle: 'wmsTxnTitle',
				btnCreateOrderLabel: 'btnCreateOrder',
				omsStatusAllOption: 'statusAll',
				omsStatusPlannedOption: 'statusPlanned',
				omsStatusPickedOption: 'statusPickedUp',
				omsStatusTransitOption: 'statusInTransit',
				omsStatusCompletedOption: 'statusCompleted',
				btnOmsRefreshLabel: 'reload',
				wmsTitle: 'wmsTitle',
				wmsDesc: 'wmsDesc',
				btnWmsInboundLabel: 'wmsInbound',
				btnWmsOutboundLabel: 'wmsOutbound',
				btnWmsAdjustLabel: 'wmsAdjust',
				wmsScopeFarmOption: 'wmsScopeFarm',
				wmsScopeFactoryOption: 'wmsScopeFactory',
				btnWmsRefreshLabel: 'reload',
				wmsScopeNote: 'wmsScopeNote',
				wmsInventoryTitle: 'wmsInventoryTitle',
				wmsTxnTitle: 'wmsTxnTitle',
				fmsTitle: 'fmsTitle',
				fmsDesc: 'fmsDesc',
				btnFmsRefreshLabel: 'reload',
				fmsChartTitle: 'fmsChartTitle',
				fmsPopulationEmptyText: 'fmsChartEmpty',
				fmsLogTitle: 'fmsLogTitle',
				setupTitle: 'setupTitle',
				setupDesc: 'setupDesc',
				btnSetupConfigLabel: 'setupConfigBtn',
				btnSetupProductLabel: 'setupProductBtn',
				btnSetupFeedLabel: 'setupFeedBtn',
				btnSetupPolicyLabel: 'setupPolicyBtn',
				setupConfigTitle: 'setupConfigTitle',
				setupProductTitle: 'setupProductTitle',
				setupFeedTitle: 'setupFeedTitle',
				setupPolicyTitle: 'setupPolicyTitle',
        btnOmsMergeSuggestLabel: 'btnOmsMergeSuggestLabel',
				btnOmsAssignTmsAllLabel: 'btnOmsAssignTmsAllLabel',
        btnOmsMergeSelectedLabel: 'btnOmsMergeSelectedLabel',
        btnOmsClearSelection: 'btnOmsClearSelectionLabel'
			};
			Object.keys(map).forEach((id) => {
				const el = document.getElementById(id);
				if (el) el.textContent = this.t(map[id]);
			});
			const omsSearch = document.getElementById('omsSearch');
			if (omsSearch) omsSearch.placeholder = this.t('searchOms');
			const setupFeedSearch = document.getElementById('setupFeedSearch');
			if (setupFeedSearch) setupFeedSearch.placeholder = this.t('setupFeedSearch');
			const setupPolicySearch = document.getElementById('setupPolicySearch');
			if (setupPolicySearch) setupPolicySearch.placeholder = this.t('setupPolicySearch');
		},

		renderUserChip: function () {
			if (!this.state.user) return;
			document.getElementById('userChip').innerHTML = '<span class="material-symbols-outlined">person</span>' +
				this.escape(this.state.user.email || 'unknown') + ' | ' + this.escape(this.state.user.role || 'User');
		},

		isProcurementUser: function () {
			const role = String((this.state.user && this.state.user.role) || '').toLowerCase();
			return /procurement|purchasing|buyer|mua\s*hang/.test(role);
		},

		isFarmTechUser: function () {
			const role = String((this.state.user && this.state.user.role) || '').toLowerCase();
			return /farm[_\s-]*technical|farm[_\s-]*tech|technical[_\s-]*farm|ky\s*thuat.*farm|farm.*ky\s*thuat/.test(role);
		},

		applyRoleBasedViewAccess: function () {
			const tabOms = document.querySelector('.nav-tab[data-view="oms"]');
			const tabWms = document.querySelector('.nav-tab[data-view="wms"]');
			if (!tabOms || !tabWms) return;

			const isProc = this.isProcurementUser();
			const isFarmTech = this.isFarmTechUser();

			if (isProc) {
				tabOms.style.display = '';
				tabWms.style.display = 'none';
			} else if (isFarmTech) {
				tabOms.style.display = 'none';
				tabWms.style.display = '';
			} else {
				tabOms.style.display = '';
				tabWms.style.display = '';
			}

			if (this.state.activeView === 'oms' && tabOms.style.display === 'none') {
				this.switchView('wms');
			}
			if (this.state.activeView === 'wms' && tabWms.style.display === 'none') {
				this.switchView('oms');
			}
		},

		refreshActiveView: async function (force) {
			if (!force && this.state.loadedViews[this.state.activeView]) return;
			if (this.state.activeView === 'dashboard') return this.loadDashboard(force);
			if (this.state.activeView === 'oms') return this.loadOms(force);
			if (this.state.activeView === 'wms') return this.loadWms(force);
			if (this.state.activeView === 'fms') return this.loadFms(force);
			if (this.state.activeView === 'setup') return this.loadSetup(force);
		},

		switchView: function (viewName) {
			this.state.activeView = viewName;
			document.querySelectorAll('.nav-tab').forEach((el) => el.classList.toggle('is-active', el.dataset.view === viewName));
			document.querySelectorAll('.view').forEach((el) => el.classList.toggle('is-active', el.id === 'view-' + viewName));
		},

		fillTenantOptions: function () {
			const tenantSelect = document.getElementById('wmsTenantFilter');
			const options = ['<option value="">' + this.escape(this.t('allTenants')) + '</option>']
				.concat(this.state.configs.map((c) => '<option value="' + this.escapeAttr(c.Tenant_id || '') + '">' +
					this.escape(c.Tenant_id || '') + ' - ' + this.escape(c.Tenant || '') + '</option>'));
			tenantSelect.innerHTML = options.join('');
		},

		fillFlockOptions: function () {
			const flockSelect = document.getElementById('fmsFlockFilter');
			const options = ['<option value="">' + this.escape(this.t('selectFlock')) + '</option>']
				.concat(this.state.flocks.map((f) => '<option value="' + this.escapeAttr(f.FLOCK_ID || '') + '">' +
					this.escape(f.FLOCK_ID || '') + ' - ' + this.escape(f.Tenant || '') + '</option>'));
			flockSelect.innerHTML = options.join('');
		},

		updateWmsScopeUi: function () {
			const scopeFilter = document.getElementById('wmsScopeFilter');
			if (scopeFilter) scopeFilter.value = 'farm';
			const scope = 'farm';
			const tenant = document.getElementById('wmsTenantFilter');
			tenant.disabled = scope === 'factory';
			if (scope === 'factory') tenant.value = '';
			this.loadWms(true);
		},

		loadDashboard: async function () {
			try {
				const [overview, alertsResp] = await Promise.all([
					this.rpc('getDashboardOverview'),
					this.rpc('getDashboardFMSAlertTable', this.state.dashboardAlertWindowDays)
				]);

				const ov = overview.data || {};
				const statusCounts = ov.orderStatusCounts || {};
				const kpis = [
					{ label: this.t('dashboardAlertTitle'), value: ov.fmsAlertCount || 0, icon: 'warning' },
					{ label: this.t('wmsScopeFactory') + ' SKU', value: (ov.factoryInventory || []).length, icon: 'factory' },
					{ label: this.t('wmsScopeFarm') + ' SKU', value: (ov.farmInventory || []).length, icon: 'agriculture' },
					{ label: this.t('navOms') + ' ' + this.t('kpiTotalSuffix'), value: Object.values(statusCounts).reduce((a, b) => a + (Number(b) || 0), 0), icon: 'receipt_long' }
				];

				document.getElementById('dashboardKpis').innerHTML = kpis.map((k) =>
					'<div class="kpi-card">' +
					'<div class="kpi-icon"><span class="material-symbols-outlined">' + k.icon + '</span></div>' +
					'<div class="kpi-label">' + this.escape(k.label) + '</div>' +
					'<div class="kpi-value">' + this.escape(String(k.value)) + '</div>' +
					'</div>'
				).join('');

				const chartData = [[this.t('hStatus'), this.t('hCount')]];
				const chartColors = [];
				Object.keys(statusCounts).forEach((k) => {
					const value = Number(statusCounts[k]) || 0;
					if (value <= 0) return;
					chartData.push([this.displayOrderStatus(k), value]);
					chartColors.push(this.orderStatusColor(k));
				});
				this.drawPie('dashboardOrderPie', 'dashboardOrderPieEmpty', chartData, chartColors);
				this.state.dashboardAlertItems = ((alertsResp && alertsResp.data && alertsResp.data.items) || []);

				this.renderDashboardAlertTable((alertsResp && alertsResp.data) || {
					items: [],
					total: 0,
					days: this.state.dashboardAlertWindowDays
				});
				this.state.loadedViews.dashboard = true;
			} catch (err) {
				this.toast(err.message || this.t('toastDashboardFailed'), 'error');
			}
		},

		renderDashboardAlertTable: function (payload) {
			const allRows = payload.items || [];
			const farmFilter = document.getElementById('dashboardAlertFarmFilter');
			const farms = [];
			const farmSeen = {};
			allRows.forEach((r) => {
				const farm = String(r.TENANT_ID || r.FARM_NAME || '').trim();
				if (!farm || farmSeen[farm]) return;
				farmSeen[farm] = true;
				farms.push(farm);
			});

			if (farms.length > 0) {
				if (!this.state.dashboardAlertFarm || farms.indexOf(this.state.dashboardAlertFarm) === -1) {
					this.state.dashboardAlertFarm = farms[0];
				}
				farmFilter.innerHTML = farms
					.map((farm) => '<option value="' + this.escapeAttr(farm) + '">' + this.escape(farm) + '</option>')
					.join('');
				farmFilter.value = this.state.dashboardAlertFarm;
				farmFilter.disabled = false;
			} else {
				this.state.dashboardAlertFarm = '';
				farmFilter.innerHTML = '<option value="">-</option>';
				farmFilter.disabled = true;
			}

			const selectedFarm = this.state.dashboardAlertFarm;
			const rows = selectedFarm
				? allRows.filter((r) => String(r.TENANT_ID || r.FARM_NAME || '').trim() === selectedFarm)
				: allRows;

			document.getElementById('dashboardAlertHead').innerHTML =
				'<tr>' +
				'<th>' + this.escape(this.t('hDate')) + '</th>' +
				'<th>' + this.escape(this.t('hFarm')) + '</th>' +
				'<th>' + this.escape(this.t('hFlock')) + '</th>' +
				'<th>' + this.escape(this.t('hProductName')) + '</th>' +
				'<th>' + this.escape(this.t('hStatus')) + '</th>' +
				'</tr>';

			document.getElementById('dashboardAlertBody').innerHTML = rows.length === 0
				? '<tr><td colspan="5"><div class="state-box">' + this.escape(this.t('msgNoLowAlert')) + '</div></td></tr>'
				: rows.map((r) =>
					'<tr>' +
					'<td>' + this.formatDate(r.DATE) + '</td>' +
					'<td>' + this.escape(r.TENANT_ID || r.FARM_NAME || '-') + '</td>' +
					'<td>' + this.escape(r.FLOCK_ID || '-') + '</td>' +
					'<td>' + this.escape(r.FEED_NAME || '-') + '</td>' +
					'<td><span class="badge ' + this.badgeClass(r.STATUS) + '">' + this.escape(this.displayThreshold(r.STATUS || '-')) + '</span></td>' +
					'</tr>'
				).join('');

			document.getElementById('dashboardAlertPagination').innerHTML = '';
		},

		loadOms: async function () {
        const body = document.getElementById('omsBody');
        body.innerHTML = '<tr><td colspan="10"><div class="state-box">' + this.escape(this.t('msgLoadingOrders')) + '</div></td></tr>';
        try {
            const status = document.getElementById('omsStatusFilter').value;
            const search = document.getElementById('omsSearch').value.trim().toLowerCase();
            const filters = status ? { Status: status } : {};
            const resp = await this.rpc('getOrderList', filters);
            let rows = resp.data || [];
            if (search) {
                rows = rows.filter((r) => {
                    const target = [
                        this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID']),
                        this.getRowValue(r, ['Client']),
                        this.getRowValue(r, ['Mã hàng', 'SKU']),
                        this.getRowValue(r, ['Nơi đi']),
						this.getRowValue(r, ['Nơi đến']),
						this.getRowValue(r, ['FLOCK_ID', 'FLOCK ID', 'Flock ID'])
                    ].join(' ').toLowerCase();
                    return target.indexOf(search) !== -1;
                });
            }
			this.state.omsRows = rows;

            // Giữ lại lựa chọn cũ chỉ cho những Order ID còn xuất hiện trong danh sách mới
            const visibleIds = {};
            rows.forEach((r) => { visibleIds[this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID'])] = true; });
            Object.keys(this.state.omsSelectedIds || {}).forEach((id) => {
                if (!visibleIds[id]) delete this.state.omsSelectedIds[id];
            });

            document.getElementById('omsHead').innerHTML =
				'<tr><th>' + this.escape(this.t('hSelect')) + '</th><th>' + this.escape(this.t('hOrderId')) + '</th><th>' + this.escape(this.t('hClient')) + '</th><th>' + this.escape(this.t('hSku')) + '</th><th>' + this.escape(this.t('hQty')) + '</th><th>' + this.escape(this.t('hFrom')) + '</th><th>' + this.escape(this.t('hTo')) + '</th><th>' + this.escape(this.t('hFlock')) + '</th><th>' + this.escape(this.t('hStatus')) + '</th><th>' + this.escape(this.t('hTmsOrderId')) + '</th><th>' + this.escape(this.t('hCreateDate')) + '</th><th>' + this.escape(this.t('hAction')) + '</th></tr>';
            body.innerHTML = rows.length === 0
				? '<tr><td colspan="12"><div class="state-box"><span class="material-symbols-outlined">inbox</span>' + this.escape(this.t('msgNoOrders')) + '</div></td></tr>'
                : rows.slice(0, 200).map((r) => {
                    const orderId = this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID']);
                    const client = this.getRowValue(r, ['Client']);
                    const sku = this.getRowValue(r, ['Mã hàng', 'SKU']);
                    const qty = this.getRowValue(r, ['Số lượng', 'Qty']);
                    const from = this.getRowValue(r, ['Nơi đi']);
                    const to = this.getRowValue(r, ['Nơi đến']);
					const flockId = this.getRowValue(r, ['FLOCK_ID', 'FLOCK ID', 'Flock ID']);
                    const statusText = this.getRowValue(r, ['Status', 'Trạng thái']);
                    const tmsOrderId = this.getRowValue(r, ['TMS_Order ID']);
                    const createDate = this.getRowValue(r, ['Create Date', 'Create date', 'Ngày tạo đơn hàng']);
                    const eligible = this.isOmsOrderMergeable(r);
					const editable = this.isOmsOrderEditable(r);
                    const checked = orderId && this.state.omsSelectedIds[orderId] ? 'checked' : '';
                    const checkboxHtml = eligible
                        ? '<input type="checkbox" data-order-id="' + this.escapeAttr(orderId) + '" ' + checked + '>'
                        : '<input type="checkbox" disabled title="' + this.escapeAttr(this.t('mergeNotEligibleHint')) + '">';
					const actionButtons =
						'<div class="inline-fields" style="gap:6px;">' +
						'<button class="btn btn-outline btn-sm" type="button" data-view-order-id="' + this.escapeAttr(orderId) + '">' + this.escape(this.t('btnViewDetail')) + '</button>' +

	/**

	isOmsOrderMergeable: function (row) {

		return status === 'Lên kế hoạch' && !tmsOrderId;

	isOmsOrderEditable: function (row) {
		const tmsOrderId = this.getRowValue(row, ['TMS_Order ID']);
		return !tmsOrderId;
	},

	handleOmsRowActionClick: function (evt) {
		const viewBtn = evt.target.closest('[data-view-order-id]');
		if (viewBtn) {
			this.openOrderDetailModal(viewBtn.dataset.viewOrderId);
			return;
		}
		const editBtn = evt.target.closest('[data-edit-order-id]');
		if (editBtn) {
			if (editBtn.disabled) return;
			this.openEditOrderModal(editBtn.dataset.editOrderId);
		}
    },

    handleOmsRowCheckboxChange: function (evt) {
        const cb = evt.target.closest('input[type="checkbox"][data-order-id]');
        if (!cb) return;
        const orderId = cb.dataset.orderId;
        if (cb.checked) {
            this.state.omsSelectedIds[orderId] = true;
        } else {
            delete this.state.omsSelectedIds[orderId];
        }
        this.updateOmsMergeToolbar();
    },

    updateOmsMergeToolbar: function () {
        const count = Object.keys(this.state.omsSelectedIds || {}).length;
        const toolbar = document.getElementById('omsMergeToolbar');
        toolbar.style.display = count > 0 ? 'flex' : 'none';
        document.getElementById('omsMergeSelectedCount').textContent = this.formatT('omsMergeSelectedCount', { count: count });
    },

    clearOmsSelection: function () {
        this.state.omsSelectedIds = {};
        document.querySelectorAll('#omsBody input[type="checkbox"][data-order-id]').forEach((cb) => { cb.checked = false; });
        this.updateOmsMergeToolbar();
    },

						'<div>' + this.escape(this.t('orderTraceFactory')) + ': <b>' + this.escape(String(factoryRows.length)) + '</b></div>' +

	openEditOrderModal: function (orderId) {
		const row = (this.state.omsRows || []).find((r) => {
			return String(this.getRowValue(r, ['Order ID', 'ORDER ID', 'WMS_Order ID', 'TMS_ORDER ID'])) === String(orderId);
		});
		if (!row) {
			this.toast(this.t('toastOrderNotFound'), 'error');
			return;
		}

		const locationSet = {};
		const locationOptions = this.state.configs
			.map((c) => String(c['Managed by'] || c.Tenant || '').trim())
			.filter((name) => {
				if (!name) return false;
				const key = name.toLowerCase();
				if (locationSet[key]) return false;
				locationSet[key] = true;
				return true;
			})
			.map((name) => '<option value="' + this.escapeAttr(name) + '">' + this.escape(name) + '</option>')
			.join('');

		const skuOptions = this.state.products.map((p) => {
			const name = String(p['Tên hàng hóa'] || '').trim();
			return '<option value="' + this.escapeAttr(name) + '">' + this.escape(name) + '</option>';
		}).join('');

		const buildFlockOptions = (destinationName, selectedValue) => {
			const normalizedDest = String(destinationName || '').trim().toLowerCase();
			const allFlocks = this.state.configs.filter((c) => String(c.FLOCK_ID || '').trim() !== '');
			const scoped = allFlocks.filter((c) => String(c.Tenant || '').trim().toLowerCase() === normalizedDest);
			const source = scoped.length > 0 ? scoped : allFlocks;
			const options = ['<option value="">' + this.escape(this.t('selectFlock')) + '</option>']
				.concat(source.map((c) => {
					const flockName = String(c.FLOCK_NAME || c.FLOCK_ID || '').trim();
					const flockId = String(c.FLOCK_ID || '').trim();
					const tenantName = String(c.Tenant || '').trim();
					const selected = selectedValue && selectedValue.toLowerCase() === flockName.toLowerCase() ? ' selected' : '';
					return '<option value="' + this.escapeAttr(flockName) + '" data-flock-id="' + this.escapeAttr(flockId) + '"' + selected + '>' +
						this.escape(flockName + ' (' + flockId + ')' + (tenantName ? ' - ' + tenantName : '')) +
					'</option>';
				}))
				.join('');
			return options;
		};

		ErpModal.open({
			title: this.t('orderEditTitle'),
			size: 'lg',
			bodyHtml:
				'<div class="form-grid">' +
				this.formField(this.t('hOrderId'), '<input class="form-control" id="e_order_id" disabled value="' + this.escapeAttr(orderId) + '">') +
				this.formField(this.t('hStatus'), '<select class="form-control" id="e_status">' +
					'<option value="Lên kế hoạch">' + this.escape(this.t('statusPlanned')) + '</option>' +
					'<option value="Đã lấy hàng">' + this.escape(this.t('statusPickedUp')) + '</option>' +
					'<option value="Chờ giao hàng">' + this.escape(this.t('statusInTransit')) + '</option>' +
					'<option value="Hoàn tất">' + this.escape(this.t('statusCompleted')) + '</option>' +
				'</select>') +
				this.formField(this.t('fClient'), '<input class="form-control" id="e_client" value="' + this.escapeAttr(this.getRowValue(row, ['Client']) || '') + '">') +
				this.formField(this.t('fSku'), '<select class="form-control" id="e_sku">' + skuOptions + '</select>') +
				this.formField(this.t('fQty'), '<input class="form-control" id="e_qty" type="number" min="1" value="' + this.escapeAttr(String(this.getRowValue(row, ['Số lượng', 'Qty']) || '')) + '">') +
				this.formField(this.t('fUom'), '<input class="form-control" id="e_uom" value="' + this.escapeAttr(this.getRowValue(row, ['UOM']) || '') + '">') +
				this.formField(this.t('fFrom'), '<select class="form-control" id="e_from">' + locationOptions + '</select>') +
				this.formField(this.t('fTo'), '<select class="form-control" id="e_to">' + locationOptions + '</select>') +
				this.formField(this.t('fFlock'), '<select class="form-control" id="e_flock_name"></select>') +
				this.formField(this.t('fPickupDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="e_pick_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="e_pick" type="date" aria-label="' + this.escapeAttr(this.t('fPickupDate')) + '"></div>') +
				this.formField(this.t('fEtaDate'), '<div class="date-proxy"><input class="form-control date-proxy-display" id="e_eta_display" type="text" placeholder="dd/mm/yyyy" readonly><input class="date-proxy-native" id="e_eta" type="date" aria-label="' + this.escapeAttr(this.t('fEtaDate')) + '"></div>') +
				this.formField(this.t('labelNote'), '<textarea class="form-control" id="e_note" rows="2">' + this.escape(this.getRowValue(row, ['Note']) || '') + '</textarea>', true) +
				'</div>',
			onOpen: () => {
				const skuVal = String(this.getRowValue(row, ['Mã hàng', 'SKU']) || '');
				const mappedProduct = this.state.products.find((p) => String(p.SKU || '').trim().toLowerCase() === skuVal.toLowerCase());
				const productNameVal = mappedProduct ? String(mappedProduct['Tên hàng hóa'] || '').trim() : skuVal;
				const statusVal = String(this.getRowValue(row, ['Status']) || 'Lên kế hoạch');
				const fromVal = String(this.getRowValue(row, ['Nơi đi']) || '');
				const toVal = String(this.getRowValue(row, ['Nơi đến']) || '');
				const flockIdVal = String(this.getRowValue(row, ['FLOCK_ID', 'FLOCK ID', 'Flock ID']) || '');
				const pickVal = this.toIsoDateInput(this.getRowValue(row, ['Ngày lấy hàng']));
				const etaVal = this.toIsoDateInput(this.getRowValue(row, ['Ngày giao hàng (Dự kiến)']));
				const skuEl = document.getElementById('e_sku');
				const statusEl = document.getElementById('e_status');
				const fromEl = document.getElementById('e_from');
				const toEl = document.getElementById('e_to');
				const flockEl = document.getElementById('e_flock_name');
				const pickEl = document.getElementById('e_pick');
				const etaEl = document.getElementById('e_eta');
				if (skuEl) skuEl.value = productNameVal;
				if (statusEl) statusEl.value = statusVal;
				if (fromEl) fromEl.value = fromVal;
				if (toEl) toEl.value = toVal;
				if (flockEl) {
					const allFlocks = this.state.configs.filter((c) => String(c.FLOCK_ID || '').trim() !== '');
					const matchedFlock = allFlocks.find((c) => String(c.FLOCK_ID || '').trim() === flockIdVal);
					const initialFlockName = matchedFlock ? String(matchedFlock.FLOCK_NAME || matchedFlock.FLOCK_ID || '').trim() : '';
					const renderFlockOptions = () => {
						flockEl.innerHTML = buildFlockOptions(toEl ? toEl.value : '', initialFlockName);
					};
					renderFlockOptions();
					if (toEl) {
						toEl.addEventListener('change', () => {
							flockEl.innerHTML = buildFlockOptions(toEl.value, '');
						});
					}
				}
				if (pickEl) pickEl.value = pickVal;
				if (etaEl) etaEl.value = etaVal;
				this.bindDateDisplayProxy('e_pick', 'e_pick_display');
				this.bindDateDisplayProxy('e_eta', 'e_eta_display');
			},
			onSubmit: async () => {
				try {
					ErpModal.setSubmitting(true);
					const targetStatus = this.value('e_status');
					const currentStatus = String(this.getRowValue(row, ['Status']) || '').trim();
					const payload = {
						Client: this.value('e_client'),
						'Mã hàng': this.value('e_sku'),
						'Số lượng': Number(this.value('e_qty')),
						UOM: this.value('e_uom'),
						'Nơi đi': this.value('e_from'),
						'Nơi đến': this.value('e_to'),
						FLOCK_NAME: this.value('e_flock_name'),
						'Ngày lấy hàng': this.value('e_pick'),
						'Ngày giao hàng (Dự kiến)': this.value('e_eta'),
						Note: this.value('e_note')
					};
					await this.rpc('updateOrder', orderId, payload);
					if (targetStatus && targetStatus !== currentStatus) {
						await this.rpc('updateOrderStatus', orderId, targetStatus);
					}
					ErpModal.close();
					this.toast(this.t('toastOrderUpdateOk'), 'success');
					this.loadOms(true);
					this.loadDashboard(true);
				} catch (err) {
					this.toast(err.message || this.t('toastOrderUpdateFailed'), 'error');
				} finally {
					ErpModal.setSubmitting(false);
				}
			}
		});
	},

    /**
    * Ghép các Order đang được tick chọn (checkbox trong bảng OMS) thành 1 lô
    * TMS duy nhất — gọi createTmsIds() với đúng 1 nhóm.
    */
    mergeSelectedOrdersToTms: async function () {
        const orderIds = Object.keys(this.state.omsSelectedIds || {});
        if (orderIds.length === 0) return;
        const ok = await ErpDialog.confirm({
            title: this.t('confirmMergeSelectedTitle'),
            message: this.formatT('confirmMergeSelectedMsg', { count: orderIds.length }),
            type: 'info',
            okLabel: this.t('btnOmsMergeSelectedLabel')
        });
        if (!ok) return;
        try {
            const resp = await this.rpc('createTmsIds', [orderIds]);
            this.toast(this.formatT('toastTmsCreateOk', { count: (resp.data || []).length }), 'success');
            this.clearOmsSelection();
            this.loadOms(true);
        } catch (err) {
            this.toast(err.message || this.t('toastTmsCreateFailed'), 'error');
        }
    },

    /**
    * Modal gợi ý ghép đơn — gọi getOrderMergeSuggestions() (filter/group thuần
    * JS ở BE, không phải hard rule), hiển thị từng nhóm kèm checkbox để user
    * chọn nhóm nào muốn thực sự tạo TMS. User được tự do bỏ chọn nhóm không
    * ưng ý — gợi ý không tự động ràng buộc gì.
    */
    openOrderMergeSuggestModal: async function () {
        try {
            const resp = await this.rpc('getOrderMergeSuggestions');
            const groups = resp.data || [];

            if (groups.length === 0) {
                ErpModal.open({
                    title: this.t('mergeSuggestTitle'),
                    bodyHtml: '<div class="state-box"><span class="material-symbols-outlined">inbox</span><span>' + this.escape(this.t('mergeSuggestEmpty')) + '</span></div>',
                    submitLabel: this.t('commonCancel')
                });
                document.getElementById('erpModalSubmitBtn').style.display = 'none';
                return;
            }

            const groupsHtml = groups.map((g, idx) => {
                const dest = (g.key && g.key['Nơi đến']) || '-';
                const pickupDate = (g.key && g.key['Ngày lấy hàng']) || '-';
                const weight = Number(g.totalWeightTon || 0).toFixed(2);
                return '<label style="display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;">' +
                    '<input type="checkbox" data-group-index="' + idx + '" checked style="margin-top:3px;">' +
                    '<div>' +
                    '<div style="font-weight:700;font-size:13px;">' + this.escape(this.formatT('mergeSuggestGroupLabel', { index: idx + 1 })) + '</div>' +
                    '<div style="font-size:12px;color:#64748b;margin-top:2px;">' +
                    this.escape(this.t('mergeSuggestDestination')) + ': ' + this.escape(dest) + ' &nbsp;|&nbsp; ' +
                    this.escape(this.t('mergeSuggestPickupDate')) + ': ' + this.escape(pickupDate) + ' &nbsp;|&nbsp; ' +
                    this.escape(this.t('mergeSuggestWeight')) + ': ' + weight +
                    '</div>' +
                    '<div style="font-size:12px;margin-top:4px;">' + this.escape(this.t('mergeSuggestOrders')) + ': ' + this.escape((g.orderIds || []).join(', ')) + '</div>' +
                    '</div>' +
                    '</label>';

		handleFmsLogPaginationClick: function (evt) {
			const btn = evt.target.closest('[data-page]');
			if (!btn) return;
			const page = Number(btn.getAttribute('data-page'));
			if (!Number.isFinite(page) || page < 1) return;

			this.renderFmsLogPage();
		},

		sortFmsRowsBySeverity: function (rows) {
			return rows.slice().sort((a, b) => {
				const rankDiff = this.thresholdSeverityRank(b['Inventory Thresholds']) - this.thresholdSeverityRank(a['Inventory Thresholds']);
				if (rankDiff !== 0) return rankDiff;
				return this.toUnixTime(b.DATE) - this.toUnixTime(a.DATE);
			});
		},

		thresholdSeverityRank: function (badge) {
			const map = {
				Critical: 5,
				High: 4,
				Low: 3,
				Safe: 2,
				Zero: 1
			};
			return map[String(badge || '')] || 0;
		},

		toUnixTime: function (value) {
			if (!value) return 0;
			const parsed = new Date(value).getTime();
			if (Number.isFinite(parsed)) return parsed;
			if (typeof value === 'string') {
				const match = value.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
				if (match) {
					const dd = Number(match[1]);
					const mm = Number(match[2]);
					const yyyy = Number(match[3]);
					const fallback = new Date(yyyy, mm - 1, dd).getTime();
					return Number.isFinite(fallback) ? fallback : 0;
				}
			}
			return 0;
		},

		renderFmsLogPage: function () {
			const rows = this.state.fmsLogRows || [];
			const body = document.getElementById('fmsBody');
			const pagination = document.getElementById('fmsLogPagination');
			if (rows.length === 0) {
				body.innerHTML = '<tr><td colspan="6"><div class="state-box">' + this.escape(this.t('msgNoFmsData')) + '</div></td></tr>';
				pagination.innerHTML = '';
				return;
			}

			const pageSize = Number(this.state.fmsLogPageSize) || 20;
			const total = rows.length;
			const totalPages = Math.max(1, Math.ceil(total / pageSize));
			let page = Number(this.state.fmsLogPage) || 1;
			if (page > totalPages) page = totalPages;
			if (page < 1) page = 1;
			this.state.fmsLogPage = page;

			const start = (page - 1) * pageSize;
			const end = Math.min(start + pageSize, total);
			const pageRows = rows.slice(start, end);

			body.innerHTML = pageRows.map((r) =>
				'<tr>' +
				'<td>' + this.formatDate(r.DATE) + '</td>' +
				'<td>' + this.escape(String(r['Ngày Tuổi'] || '')) + '</td>' +
				'<td>' + this.escape(String(r.MORT_act || 0)) + '</td>' +
				'<td>' + this.escape(String(r.POPULATION_act || '')) + '</td>' +
				'<td>' + this.escape(String(r.POPULATION_est || '')) + '</td>' +
				'<td>' + this.escape(String(this.getRowValue(r, ['FEED_QTY_USE_est', 'FEED_est', 'FEED_USE_est', 'Feed_est']) || '')) + '</td>' +
				'</tr>'
			).join('');

			const info = this.formatT('paginationInfo', {
				from: start + 1,
				to: end,
				total: total
			});

			let startPage = Math.max(1, page - 2);
			let endPage = Math.min(totalPages, startPage + 4);
			startPage = Math.max(1, endPage - 4);

			const pageButtons = [];
			for (let p = startPage; p <= endPage; p++) {
				pageButtons.push('<button class="page-btn ' + (p === page ? 'is-active' : '') + '" data-page="' + p + '">' + p + '</button>');
			}

			pagination.innerHTML =
				'<div>' + this.escape(info) + '</div>' +
				'<div class="pagination-controls">' +
				'<button class="page-btn" data-page="' + (page - 1) + '" ' + (page <= 1 ? 'disabled' : '') + '>' + this.escape(this.t('pagePrev')) + '</button>' +
				pageButtons.join('') +
				'<button class="page-btn" data-page="' + (page + 1) + '" ' + (page >= totalPages ? 'disabled' : '') + '>' + this.escape(this.t('pageNext')) + '</button>' +
				'</div>';
		},

		rpc: function (method) {
			const args = Array.prototype.slice.call(arguments, 1);
			return new Promise((resolve, reject) => {
				const runner = google.script.run
					.withSuccessHandler((resp) => {
						if (resp && resp.success) {
							resolve(resp);
						} else if (resp && typeof resp === 'object' && resp.success === false) {
							reject({
								message: (resp.error || resp.message || this.formatT('toastServerErrorFromMethod', { method: method })),
								code: resp.errorCode,
								method: method,
								raw: resp
							});
						} else {
							let rawText = '';
							try {
								rawText = JSON.stringify(resp);
							} catch (e) {
								rawText = String(resp);
							}
							reject({
								message: this.formatT('toastInvalidResponseFromMethod', { method: method }) + (rawText ? (' | raw=' + rawText) : ''),
								code: resp && resp.errorCode,
								method: method,
								raw: resp
							});
						}
					})
					.withFailureHandler((err) => {
						reject({
							message: (err && err.message ? err.message : String(err)) + ' | method=' + method,
							method: method,
							raw: err
						});
					});
				const fn = runner[method];
				if (typeof fn !== 'function') {
					reject({ message: this.formatT('toastMethodNotFound', { method: method }) });
					return;
				}
				fn.apply(runner, args);
			});
		},

		callRaw: function (method) {
			const args = Array.prototype.slice.call(arguments, 1);
			return new Promise((resolve, reject) => {
				const runner = google.script.run
					.withSuccessHandler((resp) => resolve(resp))
					.withFailureHandler((err) => reject(err));
				const fn = runner[method];
				if (typeof fn !== 'function') {
					reject(new Error(this.formatT('toastMethodNotFound', { method: method })));
					return;
				}
				fn.apply(runner, args);
			});
		},

		formatIsoDateForDisplay: function (isoValue) {
			if (!isoValue) return '';
			const parts = String(isoValue).split('-');
			if (parts.length !== 3) return '';

		},

		bindDateDisplayProxy: function (nativeId, displayId) {
			const nativeInput = document.getElementById(nativeId);
			const displayInput = document.getElementById(displayId);
			if (!nativeInput || !displayInput) return;

			const syncDisplay = () => {
				displayInput.value = this.formatIsoDateForDisplay(nativeInput.value);
			};

			const openPicker = () => {
				if (typeof nativeInput.showPicker === 'function') {
					nativeInput.showPicker();
				} else {
					nativeInput.focus();
				}
			};

			displayInput.addEventListener('click', openPicker);
			displayInput.addEventListener('focus', openPicker);
			displayInput.addEventListener('keydown', (evt) => {
				if (evt.key !== 'Enter' && evt.key !== ' ') return;
				evt.preventDefault();
				openPicker();
			});

			nativeInput.addEventListener('change', syncDisplay);
			nativeInput.addEventListener('input', syncDisplay);
			syncDisplay();
		},

		toIsoDateInput: function (value) {
			if (!value) return '';
			const d = new Date(value);
			if (isNaN(d.getTime())) return '';
			const yyyy = d.getFullYear();
			const mm = String(d.getMonth() + 1).padStart(2, '0');
			const dd = String(d.getDate()).padStart(2, '0');
			return yyyy + '-' + mm + '-' + dd;
		},

		isFutureDate: function (value) {
			if (!value) return false;
			const d = new Date(value);
			if (isNaN(d.getTime())) return false;
			d.setHours(0, 0, 0, 0);
			const today = new Date();
			today.setHours(0, 0, 0, 0);
			return d.getTime() > today.getTime();
		},

		getRowValue: function (row, candidateKeys) {
			if (!row || !candidateKeys || candidateKeys.length === 0) return '';
			for (let i = 0; i < candidateKeys.length; i++) {
				const key = candidateKeys[i];
				if (Object.prototype.hasOwnProperty.call(row, key)) {
					const v = row[key];
					if (v !== undefined && v !== null && String(v).trim() !== '') return v;
				}
			}

			const normalize = (text) => String(text || '').toLowerCase().replace(/[^a-z0-9]/g, '');
			const normalizedCandidates = candidateKeys.map(normalize);
			const keys = Object.keys(row);
			for (let k = 0; k < keys.length; k++) {
				const rawKey = keys[k];
				if (normalizedCandidates.indexOf(normalize(rawKey)) === -1) continue;
				const value = row[rawKey];
				if (value !== undefined && value !== null && String(value).trim() !== '') return value;
			}

			return '';
		},

		badgeClass: function (badge) {
			const map = {
				Zero: 'badge-zero',
				Critical: 'badge-critical',
				Low: 'badge-low',
				Safe: 'badge-safe',
				High: 'badge-high'
			};
			return map[badge] || 'badge-empty';
		},

		orderStatusClass: function (status) {
			if (status === 'Lên kế hoạch') return 'badge-order-pending';
			if (status === 'Đã lấy hàng') return 'badge-order-deducted';
			if (status === 'Chờ giao hàng') return 'badge-order-deducted';
			if (status === 'Hoan tat') return 'badge-order-completed';
			if (status === 'Hoàn tất') return 'badge-order-completed';
			return 'badge-order-error';
		},

		orderStatusColor: function (status) {
			if (status === 'Lên kế hoạch' || status === 'Planning') return '#d55053';
			if (status === 'Đã lấy hàng' || status === 'Picked up') return '#5bb1de';
			if (status === 'Chờ giao hàng' || status === 'In transit') return '#245d4b';
			if (status === 'Hoan tat') return '#8abda2';
			if (status === 'Hoàn tất' || status === 'Completed') return '#8abda2';
			return '#64748b';
		},

		displayOrderStatus: function (status) {
			if (status === 'Lên kế hoạch') return this.t('statusPlanned');
			if (status === 'Đã lấy hàng') return this.t('statusPickedUp');
			if (status === 'Chờ giao hàng') return this.t('statusInTransit');
			if (status === 'Hoan tat') return this.t('statusCompleted');
			if (status === 'Hoàn tất') return this.t('statusCompleted');
			if (status === 'Planning') return this.t('statusPlanned');
			if (status === 'Picked up') return this.t('statusPickedUp');
			if (status === 'In transit') return this.t('statusInTransit');
			if (status === 'Completed') return this.t('statusCompleted');
			return status || '-';
		},

		displayThreshold: function (badge) {
			if (badge === 'Zero') return this.t('badgeZero');
			if (badge === 'Critical') return this.t('badgeCritical');
			if (badge === 'Low') return this.t('badgeLow');
			if (badge === 'Safe') return this.t('badgeSafe');
			if (badge === 'High') return this.t('badgeHigh');
			return badge || '-';
		},

		translateLocation: function (value) {
			if (value === 'Nhà máy' || value === 'Factory') return this.t('wmsScopeFactory');
			if (value === 'Trại' || value === 'Farm') return this.t('wmsScopeFarm');
			return value;
		},

		formatDate: function (value) {
			if (!value) return '-';
			const d = new Date(value);

			if (isNaN(d.getTime())) return this.escape(String(value));
			const dd = String(d.getDate()).padStart(2, '0');
			const mm = String(d.getMonth() + 1).padStart(2, '0');
			const yyyy = d.getFullYear();
			return dd + '/' + mm + '/' + yyyy;
		},

		escape: function (str) {
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		},

		escapeAttr: function (str) {
			return this.escape(str).replace(/`/g, '&#96;');
		}
	};

	window.App = App;

	document.addEventListener('DOMContentLoaded', function () {
		App.init();
	});
</script>
