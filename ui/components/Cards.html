<!--
  FILE: Components/Cards.html
  PURPOSE: KPI summary card + Inventory badge card — dùng ở Dashboard/FMS/WMS.
  DEPENDENCIES: style.css
-->
<template id="tpl-kpi-card">
  <div class="kpi-card">
    <div class="kpi-icon"><span class="material-symbols-outlined kpi-icon-glyph">insights</span></div>
    <div class="kpi-label kpi-label-text">Label</div>
    <div class="kpi-value kpi-value-text">0</div>
  </div>
</template>

<!-- Inventory status card — map trực tiếp field trả về từ InventoryService.gs
     (SKU/Tenant/currentStock/badge/badgeColor) -->
<template id="tpl-inventory-card">
  <div class="card" style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-weight:700;font-size:13.5px;" class="inv-sku">SKU</div>
        <div style="font-size:11.5px;color:#64748b;" class="inv-tenant">Tenant</div>
      </div>
      <span class="badge inv-badge">--</span>
    </div>
    <div style="font-size:20px;font-weight:800;" class="inv-stock">0</div>
    <div style="font-size:11px;color:#94a3b8;" class="inv-meta">--</div>
  </div>
</template>
